</style></head><body><main id="app"></main><aside id="chapters" class="chapter-panel" hidden aria-label="Concept chapter index"></aside><script>window.S157_SCENES={"title": "Silver Citadel \u2014 current UI rearranged in phases", "date": "2026-10-04", "scope": "HTML design concepts, not implemented product or QA evidence", "scenes": [{"id": "m01", "platform": "mobile", "title": "Choose your workspace", "subtitle": "Start with the right context", "kind": "workspace", "next": "m02", "action": "Open Northstar", "narration": "Begin with the workspace selector you already have. This revision uses the actual test screenshots as its visual baseline: the same charcoal surfaces, text hierarchy and orange mobile actions. We rearrange existing tools first, add the small missing functional pieces next, and leave visual polish for Stage Two.", "phase": "1A", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "None: retain the existing workspace selection route.", "baseline": "mobile-home"}, {"id": "m02", "platform": "mobile", "title": "Your work, at a glance", "subtitle": "Thy Quill", "kind": "board", "next": "m03", "action": "Filter tasks", "narration": "Keep the current Thy Quill cards, workspace picker, overflow actions and add button. The phone retains its five existing destinations: Thy Quill, Minions, Scrolls, Rituals and Omens. Control and Chronicle are not part of this mobile draft.", "phase": "1A", "existing": "Workspace header, task cards, overflow, add action and five existing mobile tabs.", "addition": "Stage 1B adds the filter row; Stage 1A shows the existing board without those controls.", "baseline": "mobile-home"}, {"id": "m03", "platform": "mobile", "title": "Find the work you need", "subtitle": "One status, plus useful refinements", "kind": "filters", "next": "m04", "action": "Apply filters", "narration": "Choose one status filter, then optionally add text search and Has materials. Started means work began before. Agents running means someone is executing now. Needs your attention is an actual question or request, not a guess based on an idle terminal.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Only the task/material/agent context needed for this flow.", "baseline": "mobile-home"}, {"id": "m04", "platform": "mobile", "title": "Only the active work", "subtitle": "Agents running \u00b7 2 matches", "kind": "running", "next": "m05", "action": "Open Welcome screen", "narration": "Here are the tasks with agents running. A child asking a question stays visible alongside its working parent. Unknown status has its own route. Filtering changes what you see; it never moves a row or starts an agent.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Only the task/material/agent context needed for this flow.", "baseline": "mobile-home"}, {"id": "m05", "platform": "mobile", "title": "One task, everything together", "subtitle": "Welcome screen feels clear", "kind": "task", "next": "m06", "action": "Open Materials", "narration": "Open the task through its explicit detail action. The brief, materials and associated agents now belong to one place. Editing and dragging the board row keep their existing routes. The agent can keep working while you review what it produced.", "phase": "1B", "existing": "Existing task label, resource counts, attachment expansion and associated session evidence.", "addition": "A compact task detail route with Materials and Agents choices; return restores the same board position.", "baseline": "mobile-home"}, {"id": "m06", "platform": "mobile", "title": "A shelf for what already exists", "subtitle": "Copies, live files and destinations", "kind": "materials", "next": "m07", "action": "Read the brief", "narration": "This is the existing expanded-materials presentation from the tests, moved into the selected task. Keep separate Attachments, Workspace documents and Public URLs, including their current freshness and availability states. Stage One B adds a neat viewing route; it does not invent a new file library.", "phase": "1B", "existing": "Existing Attachments, Workspace documents and Public URL sections, statuses and actions.", "addition": "Present those same groups in a dedicated task material view; add selected-material context.", "baseline": "mobile-materials"}, {"id": "m07", "platform": "mobile", "title": "Read the PDF in the task", "subtitle": "Brief.pdf \u00b7 page 2 of 4", "kind": "pdf", "next": "m08", "action": "Read the live document", "narration": "Read an ordinary PDF without leaving the task. Page controls and zoom are easy to reach. The copied brief keeps its revision label. Returning to materials keeps your task and reading context, rather than making you find the row again.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Minimal ordinary PDF reader and page/zoom adapter, only where the current viewer lacks it.", "baseline": "mobile-home"}, {"id": "m08", "platform": "mobile", "title": "Know when a document is live", "subtitle": "Workspace document \u00b7 current source", "kind": "document", "next": "m09", "action": "Watch the walkthrough", "narration": "A workspace document is visibly live. Its current revision may be newer than the copied PDF. That distinction matters when you comment on a specific version. The interface should show freshness honestly instead of calling every file the latest.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Preserve exact task/resource context around the existing document viewer.", "baseline": "mobile-home"}, {"id": "m09", "platform": "mobile", "title": "Watch without leaving the task", "subtitle": "Walkthrough.mp4 \u00b7 video player", "kind": "video", "next": "m10", "action": "Listen to the audio", "narration": "Video playback belongs in Stage One. An MP4 opens inside the material view, with play, pause, seeking, elapsed time, volume and an expand action. Playback begins deliberately. Unsupported or unavailable media gets an honest explanation, not a pretend loaded player.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "In-app MP4 H.264/AAC player adapter with deliberate playback and lifecycle handling.", "baseline": "mobile-home"}, {"id": "m10", "platform": "mobile", "title": "Listen to the same material", "subtitle": "Brief narration.mp3 \u00b7 audio player", "kind": "audio", "next": "m11", "action": "See associated agents", "narration": "Audio gets a proper player too, using the existing attached file. You can pause, seek and replay. Leaving the phone player releases playback. Coming back never starts hidden sound automatically. Generating new narration is a separate capability from playing what is already attached.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "In-app MP3, M4A/AAC and WAV PCM adapter using the same existing file binding.", "baseline": "mobile-home"}, {"id": "m11", "platform": "mobile", "title": "Reach the agent doing this work", "subtitle": "Two associated agents", "kind": "agents", "next": "m12", "action": "Open Rowan\u2019s terminal", "narration": "The agent list uses proven task associations. Rowan is the lead, and Mira is a real child in this fictional example. Selecting an agent opens that exact existing session. Unknown or ended associations are explained; opening the task never silently launches a replacement.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Task-scoped associated-agent selector and typed exact-target projection where absent.", "baseline": "mobile-agents"}, {"id": "m12", "platform": "mobile", "title": "Continue the actual conversation", "subtitle": "Rowan \u00b7 existing session", "kind": "terminal", "next": "m13", "action": "Write an instruction", "narration": "The mobile terminal keeps its current agent pill, output typography and bottom composer. Selecting an associated agent opens that existing session. Back returns to the selected task. We are retaining Minions and its current controls, not inventing a second chat interface.", "phase": "1A", "existing": "Existing agent/session pill, output area, mic and Draft thy decree composer.", "addition": "Rehost the existing terminal; same session and input controls.", "baseline": "mobile-agents"}, {"id": "m13", "platform": "mobile", "title": "Send with a clear target", "subtitle": "Review the instruction before sending", "kind": "compose", "next": "m14", "action": "Send to Rowan", "narration": "Before sending, the task and recipient remain visible. Here we ask Rowan to shorten the introduction in the reviewed brief. This reuses explicit communication with the existing agent. A new persistent feedback and iteration system is still separately scoped.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Show the exact selected task/material revision around the existing explicit send action; new persistent feedback systems remain separate.", "baseline": "mobile-agents"}, {"id": "m14", "platform": "mobile", "title": "Activity is not acceptance", "subtitle": "Instruction delivered \u00b7 work continues", "kind": "progress", "next": "m19", "action": "Review the question", "narration": "The instruction is delivered to the current session, and activity changes without pretending the task is complete. Agent completion, product QA and your own acceptance remain separate. The board is not moved or cleared just because an agent returns a successful result.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Only needed for this flow.", "baseline": "mobile-materials"}, {"id": "m18", "platform": "mobile", "title": "Open links deliberately", "subtitle": "Public URL \u00b7 destination visible", "kind": "url", "next": "m19", "action": "Back to attention", "narration": "A public link shows its label and destination before the deliberate open action. It stays a link. This concept uses a harmless example address, and every task and file shown in these mock-ups is fictional.", "phase": "1A", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Only the task/material/agent context needed for this flow.", "baseline": "mobile-materials"}, {"id": "m19", "platform": "mobile", "title": "Questions deserve a clear place", "subtitle": "Needs your attention", "kind": "attention", "next": "m20", "action": "Inspect a hidden selection", "narration": "Needs your attention brings real questions and approvals forward. A working lead does not hide a child waiting for you. The action takes you to the correct existing conversation, rather than a similarly named agent in another workspace.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Only the task/material/agent context needed for this flow.", "baseline": "mobile-agents"}, {"id": "m20", "platform": "mobile", "title": "A filter cannot steal your task", "subtitle": "Selected task outside current filter", "kind": "outside", "next": "m21", "action": "See an empty result", "narration": "Suppose the agent stops running while you are reading its brief. The task may leave the running filter, but your open work stays put. A notice explains that it is outside the current filter, and Reveal takes you back without switching to a neighbour.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Only the task/material/agent context needed for this flow.", "baseline": "mobile-home"}, {"id": "m21", "platform": "mobile", "title": "Make empty results recoverable", "subtitle": "No matching tasks", "kind": "empty", "next": "m22", "action": "See an offline state", "narration": "An empty result tells you which filters are active and offers one clear way back to all tasks. It does not look like lost data. Search and material filters are private viewing preferences, and Back restores your prior list position.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Only the task/material/agent context needed for this flow.", "baseline": "mobile-home"}, {"id": "m22", "platform": "mobile", "title": "Unknown is different from unstarted", "subtitle": "Offline \u00b7 last known information", "kind": "offline", "next": "m23", "action": "Inspect a material error", "narration": "When connectivity is unavailable, the app keeps known started history and labels current agent status as unavailable. An ended connection is not proof that work never began. Available local materials can still be read, while pending actions retain their honest state.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Only the task/material/agent context needed for this flow.", "baseline": "mobile-home"}, {"id": "m23", "platform": "mobile", "title": "Failure states stay useful", "subtitle": "This material cannot play yet", "kind": "error", "next": "m24", "action": "Switch to Rituals", "narration": "A damaged download, denied access or unsupported codec explains what failed and what you can do next. Retry and external opening are explicit fallbacks. They do not count as successful in-app playback for the supported formats in the Stage One requirement.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Only the task/material/agent context needed for this flow.", "baseline": "mobile-home"}, {"id": "m24", "platform": "mobile", "title": "The same pattern for Rituals", "subtitle": "Rituals", "kind": "rituals", "next": "m25", "action": "Open the definition", "narration": "Rituals remains its existing mobile tab, with the schedule cards and overflow actions from the test screenshots. We reuse those definitions and occurrences. The new task-like material and agent context connects to them in Stage One B; it does not replace the scheduler or add desktop modes to the phone.", "phase": "1A", "existing": "Existing Rituals tab, schedule cards, run status and add/menu actions.", "addition": "Reuse definition and occurrence navigation; Stage 1B links their materials and associated agents.", "baseline": "mobile-rituals"}, {"id": "m25", "platform": "mobile", "title": "Keep instructions and timing clear", "subtitle": "Daily summary \u00b7 definition", "kind": "schedule", "next": "m26", "action": "Review the latest occurrence", "narration": "The definition shows the existing instructions, schedule and target. Editing the schedule is a deliberate save, separate from commenting on a report. Reviewing an output does not silently change tomorrow\u2019s timing or launch another occurrence.", "phase": "1A", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Only the task/material/agent context needed for this flow.", "baseline": "mobile-rituals"}, {"id": "m26", "platform": "mobile", "title": "Review one particular occurrence", "subtitle": "Today \u00b7 09:00 occurrence", "kind": "occurrence", "next": "m27", "action": "Inspect retained output", "narration": "An occurrence keeps its own output and associated run. Open its report using the same material experience. A successful scheduler result is different from a useful report; the screen makes space for your review rather than treating green execution as approval.", "phase": "1A", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Only the task/material/agent context needed for this flow.", "baseline": "mobile-rituals"}, {"id": "m27", "platform": "mobile", "title": "Do not invent a live session", "subtitle": "Finished occurrence \u00b7 retained summary", "kind": "retained", "next": "m30", "action": "Open existing settings", "narration": "An ended occurrence keeps its retained output available. This uses the existing Ritual history and report routes. It does not fabricate a live agent or a complete conversation archive. The next stop is the existing settings screen, reached from the workspace header.", "phase": "1A", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Only the task/material/agent context needed for this flow.", "baseline": "mobile-rituals"}, {"id": "m30", "platform": "mobile", "title": "Keep the current settings route", "subtitle": "Settings", "kind": "settings", "next": "m32", "action": "Open Omens", "narration": "Settings stays behind the current gear in the workspace header. This draft retains the existing mobile appearance and controls. It does not add a new Armoury bottom tab or promise a mobile light-mode redesign. Visual polish is a later phase, after the task experience works.", "phase": "1A", "existing": "Current settings gear and settings rows.", "addition": "None in this phase; appearance redesign is deferred.", "baseline": "mobile-home"}, {"id": "m32", "platform": "mobile", "title": "A notification returns to the work", "subtitle": "Omens", "kind": "notifications", "next": "m33", "action": "Review before completion", "narration": "A notification names the task and the agent that needs you. Following it restores the right workspace and task, even if an old filter would hide it. It should never throw your reply into whichever terminal happened to be selected previously.", "phase": "1A", "existing": "Existing Omens inbox and destination links.", "addition": "Preserve exact workspace/task/session destination when selected filters would hide it.", "baseline": "mobile-home"}, {"id": "m33", "platform": "mobile", "title": "You decide when it is done", "subtitle": "Agent finished \u00b7 your review remains", "kind": "review", "next": "m02", "action": "Return to the board", "narration": "Review the changed material and the evidence available for the task. Mobile does not gain Control or Chronicle in this draft. Existing agent discussion and material review are enough here; repository review stays on desktop. Only your deliberate acceptance completes the task.", "phase": "1A", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "No new mobile repository review. Retain the current deliberate completion action.", "baseline": "mobile-home"}, {"id": "m34", "platform": "mobile", "title": "Keep Scrolls available", "subtitle": "Scrolls", "kind": "scrolls", "next": "m06", "action": "Open task materials", "narration": "Scrolls remains the current mobile file destination. The task material shelf is a contextual view of existing bindings, not a replacement for workspace files. Use the same document rows and viewer routes, then return to the task that owns the material.", "phase": "1A", "existing": "Current Scrolls tab, file rows and viewer route.", "addition": "Stage 1B adds task-to-material return context.", "baseline": "mobile-scrolls"}, {"id": "d01", "platform": "desktop", "title": "The whole workspace together", "subtitle": "Task \u00b7 material \u00b7 agents \u00b7 terminal", "kind": "overview", "focus": "left", "next": "d02", "action": "Next view", "narration": "Start with the existing desktop interface from the test screenshots: compact toolbar, Command, Control and Chronicle tabs, grey panels, blue selection and the real terminal. Stage One A moves Thy Quill left, the existing viewer centre and the current agent and terminal controls right. It is a rearrangement of the current product.", "phase": "1A", "existing": "Current toolbar, workspace label, Command/Control/Chronicle modes, Quill, navigation and PTY.", "addition": "Rearrange panels with independent material and terminal focus; retain all current controls.", "baseline": "desktop-terminal"}, {"id": "d02", "platform": "desktop", "title": "Find the work that matters", "subtitle": "Search and status above the task list", "kind": "filters", "focus": "left", "next": "d03", "action": "Next view", "narration": "Filters sit above the task list. Choose one status, then combine it with text search and Has materials. Started and currently running are different. Unknown status is visible. The seven board sections, stored order and row identities remain unchanged.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Status/text/material filters and a truthful scoped status projection; no new task database.", "baseline": "desktop-terminal"}, {"id": "d03", "platform": "desktop", "title": "A brief beside a working agent", "subtitle": "Independent material and terminal selection", "kind": "pdf", "focus": "centre", "next": "d04", "action": "Next view", "narration": "Read the PDF while the same agent continues working alongside it. This needs independent material and terminal selection, because the current shared area chooses between them. The new viewer host reuses existing Markdown and image viewers and adds the missing ordinary PDF reader.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Independent viewer/terminal selection plus the missing ordinary PDF adapter.", "baseline": "desktop-terminal"}, {"id": "d04", "platform": "desktop", "title": "A clear material shelf", "subtitle": "Snapshot \u00b7 live document \u00b7 public URL", "kind": "materials", "focus": "centre", "next": "d05", "action": "Next view", "narration": "The shelf shows what is already attached or bound to the task. A copied PDF remains a snapshot, a workspace document is live, and a web destination remains a public link. Names, freshness and availability help you choose the right thing before giving feedback.", "phase": "1B", "existing": "Current resource popover sections, links, status and remove/bind actions.", "addition": "Move the same resource groups into the centre shelf and add selection state.", "baseline": "desktop-materials"}, {"id": "d05", "platform": "desktop", "title": "Watch the proposed experience", "subtitle": "MP4 playback in the centre", "kind": "video", "focus": "centre", "next": "d06", "action": "Next view", "narration": "MP4 video plays inside the centre material area. Play, pause, seek, volume and expansion are ordinary first-stage controls. The agent terminal stays alive. A public URL is not automatically fetched, and a failed decoder does not masquerade as a working player.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Only the task/material/agent context needed for this flow.", "baseline": "desktop-terminal"}, {"id": "d06", "platform": "desktop", "title": "Listen and keep your context", "subtitle": "Audio playback without a new library", "kind": "audio", "focus": "centre", "next": "d07", "action": "Next view", "narration": "An attached audio file uses the same shelf and a compact player. Playback begins deliberately, and switching material stops the previous player. A filter change alone keeps your selected task and media intact. Generation, editing and transcoding remain separate proposals.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Only the task/material/agent context needed for this flow.", "baseline": "desktop-terminal"}, {"id": "d07", "platform": "desktop", "title": "Choose the exact associated agent", "subtitle": "Working parent \u00b7 child needs attention", "kind": "agents", "focus": "right", "next": "d08", "action": "Next view", "narration": "The right-hand ository history", "kind": "control", "focus": "centre", "next": "d11", "action": "Next view", "narration": "Control remains code review, and Chronicle remains repository history. Their scope does not shrink to the selected task. This preserves existing workflows while making task work more coherent, rather than replacing the whole application with a single new screen.", "phase": "1A", "existing": "Current desktop Control and Chronicle workflows.", "addition": "None on mobile; preserve desktop repository-wide scope.", "baseline": "desktop-terminal"}, {"id": "d11", "platform": "desktop", "title": "State changes without losing your place", "subtitle": "Outside-filter, unavailable and empty states", "kind": "outside", "focus": "left", "next": "d12", "action": "Next view", "narration": "When live status changes, counts and list membership can update without stealing selection. An open task outside the current filter stays visible with a Reveal action. Offline and unknown states are explicit, and clearing an empty filter restores the list without changing stored data.", "phase": "1B", "existing": "Current task identity, resource bindings, session and platform controls.", "addition": "Only the task/material/agent context needed for this flow.", "baseline": "desktop-terminal"}, {"id": "d12", "platform": "desktop", "title": "Visual polish comes after function", "subtitle": "Stage 2 \u2014 deferred", "kind": "polish", "focus": "centre", "next": "d01", "action": "Next view", "narration": "Stage Two is visual polish after the working layout and minimum additions. This draft deliberately retains the current Classic test-screenshot appearance instead of inventing a new skin. Desktop Control and Chronicle remain desktop features. The PDF maps every functional addition to Stage One A or One B, with separate exit criteria.", "phase": "2", "existing": "The functioning Stage 1A and Stage 1B composition.", "addition": "Later icons, spacing, typography, themes and accessibility refinements, without new functional scope.", "baseline": "desktop-terminal"}, {"id": "d13", "platform": "desktop", "title": "Keep desktop repository history", "subtitle": "Existing desktop function", "kind": "chronicle", "next": "d01", "action": "Return to Command", "narration": "Retain this existing desktop workflow and its current visual controls. The task composition does not change its scope or create a corresponding mobile feature.", "phase": "1A", "existing": "Current desktop chronicle surface.", "addition": "None; preserve existing behaviour.", "baseline": "desktop-toolbar", "focus": "centre"}, {"id": "d14", "platform": "desktop", "title": "Keep desktop Armoury available", "subtitle": "Existing desktop function", "kind": "settings", "next": "d01", "action": "Return to Command", "narration": "Retain this existing desktop workflow and its current visual controls. The task composition does not change its scope or create a corresponding mobile feature.", "phase": "1A", "existing": "Current desktop settings surface.", "addition": "None; preserve existing behaviour.", "baseline": "desktop-toolbar", "focus": "centre"}], "revision": "Current screenshot baseline correction \u00b7 4 October 2026", "phases": [{"id": "1A", "title": "Rearrange existing components", "scope": "Keep current visuals, controls, five mobile tabs and desktop modes. Move Quill left, current viewer centre, agents/terminal right. Preserve identity, focus and access.", "exit": "Existing actions remain reachable and behave as before in the rearranged layout."}, {"id": "1B", "title": "Add the minimum missing functionality", "scope": "Task detail/material shelf; ordinary PDF and MP4/audio adapters; status filters; exact task/material/agent selection and back/context glue. Add metadata only for a proven selected save or publication gap.", "exit": "Select task, filter, read/watch/listen and continue its exact existing agent; correct back, offline and failure behaviour."}, {"id": "2", "title": "Polish the working experience", "scope": "Visual consistency, icons, density, themes, responsive refinements and accessibility matrix. No new functional architecture or mobile desktop-mode expansion.", "exit": "Same functional fixtures pass with the intended visual refinements."}]};</script><script>/* Fictional, offline design proposal. No product APIs or real task mutations. */
let scenes=[], current, phases=[];
const mobileIds=()=>scenes.filter(s=>s.platform==='mobile');
const desktopIds=()=>scenes.filter(s=>s.platform==='desktop'); const app=document.querySelector('#app');

const target=id=>current?.platform==='desktop'?({'m02':'d01','m03':'d02','m04':'d02','m05':'d01','m06':'d04','m07':'d03','m08':'d03','m09':'d05','m10':'d06','m11':'d07','m12':'d08','m19':'d07','m20':'d11','m24':'d09','m28':'d10','m31':'d12','m29':'d13','m28':'d10','m30':'d14'}[id]||id):id;
const link=(id,label,cls='button')=>`<a class="${cls}" href="#${target(id)}">${label}</a>`;
const btn=(label,note,cls='')=>`<button class="${cls}" data-note="${esc(note||'Concept only — this action would use the existing product control.')}">${label}</button>`;
const title=(s)=>{const labels={workspace:'Choose workspace',board:'Thy Quill',filters:'Filter tasks',running:'Thy Quill · Agents running',task:'Welcome screen feels clear',materials:'Welcome screen feels clear',pdf:'Welcome brief.pdf',document:'Welcome brief.md',video:'Experience walkthrough.mp4',audio:'A narrated brief.mp3',agents:'Minions · Welcome screen feels clear',terminal:'Minions',compose:'Draft thy decree',progress:'Welcome screen feels clear',launch:'Commence',edit:'Edit task',add:'Add resource',url:'Reference gallery',attention:'Mira needs your answer',outside:'Welcome screen feels clear',empty:'Thy Quill',offline:'Thy Quill · Offline',error:'Preview unavailable',rituals:'Rituals',schedule:'Daily summary',occurrence:'Daily summary · Today',retained:'Daily summary · Retained output',settings:'Settings',notifications:'Omens',review:'Review task',scrolls:'Scrolls',overview:'Welcome brief.md',control:'Control',chronicle:'Chronicle',polish:'Later visual refinement'};return `<div class="title"><h1>${esc(labels[s.kind]||s.subtitle)}</h1></div>`;};
const glyph=(name)=>{const paths={home:'M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z',robot:'M20 8h-2V5h-5V3h-2v2H6v3H4v10h2v3h12v-3h2V8zm-4 9H8V9h8v8zM9 11h2v2H9zm4 0h2v2h-2z',doc:'M6 2h8l4 4v16H6V2zm7 2v4h4M8 12h8M8 16h8',clock:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5v5l4 2-1 2-5-3V7z',gear:'m19.4 13 .1-1-.1-1 2-1.5-2-3.5-2.3 1a8 8 0 0 0-1.7-1L15 3h-4l-.4 3a8 8 0 0 0-1.7 1L6.5 6l-2 3.5 2 1.5-.1 1 .1 1-2 1.5 2 3.5 2.4-1a8 8 0 0 0 1.7 1l.4 3h4l.5-3a8 8 0 0 0 1.7-1l2.3 1 2-3.5-2.1-1.5zM13 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8z',mic:'M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 7v3h2v-3a7 7 0 0 0 6-7z',refresh:'M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.2L13 11h9V2z'};return `<svg viewBox="0 0 24 24" aria-hidden="true" class="icon"><path d="${paths[name]||paths.doc}" fill="currentColor"/></svg>`;};
const phaseText=s=>s.phase==='1A'?'Stage 1A · rearrange':s.phase==='1B'?'Stage 1B · add minimum':'Stage 2 · polish later';
const tabs=active=>`<div class="tabs">${['Overview','Materials','Agents'].map((x,i)=>link(['m05','m06','m11'][i],x,x===active?'active':'')).join('')}</div>`;

const groups=[['🔮 Future',[]],['🟠 Backlog',[['A calmer first minute','Not started · 2 materials','m15']]],['🟣 Pending coding',[['Welcome screen feels clear','2 agents · 5 materials','m05'],['The export has a home','Working · 1 material','m05']]],['🧪 New commits to QA',[['A smoother sign-in','Ready for your review','m33']]],['🎬 QA’d items',[['Readable at a glance','Evidence attached','m33']]],['🧩 Implicitly QA’d',[]],['📣 Unfiltered feedback',[['Make room for the notes','Your inbox','m16']]]];
function board(filtered=false){return `<div class="board">${groups.map(([h,items])=>`<div class="bucket">${h}</div>${items.filter((v,i)=>!filtered||h.includes('Pending')).map(([n,t,id])=>`<a class="task-row ${n.startsWith('Welcome')?'chosen':''}" href="#${id}"><span class="dot ${t.includes('Not')?'grey':''}"></span><span class="label">${n}<span class="sub">${t}</span></span><span>›</span></a>`).join('')}`).join('')}</div>`}
const materialRows=()=>`<div class="resource-group"><h3>Attachments</h3>${[['PDF','Welcome brief.pdf','240 KiB · copied snapshot','m07'],['MP4','Experience walkthrough.mp4','Video · 02:14','m09'],['MP3','A narrated brief.mp3','Audio · 01:32','m10']].map(([icon,n,t,id])=>`<div class="material"><a class="resource-open" href="#${target(id)}"><span class="fileicon">${icon}</span><span><span class="name">${n}</span><small>${t}</small></span></a>${btn('×','Remove this attachment binding; do not delete its original source.','quiet')}</div>`).join('')}<h3>Workspace documents</h3><div class="material"><a class="resource-open" href="#${target('m08')}"><span class="fileicon live">MD</span><span><span class="name">Welcome brief</span><small>docs/welcome-brief.md</small></span></a><span class="resource-state live">Sealed<small>Live binding</small></span></div><h3>Public URLs</h3><a class="material" href="#m18"><span class="fileicon">↗</span><span><span class="name">Reference gallery</span><small>example.com · open on demand</small></span></a>${link('m17','+ Add resource','button resource-add')}</div>`;
const agents=()=>`<a href="#m12" class="agent"><span class="avatar">R</span><div><b>Rowan</b><small>Lead · <span class="live">working</span></small></div><span class="tag" style="margin-left:auto">Local</span></a><a href="#m19" class="agent"><span class="avatar">M</span><div><b>Mira</b><small>Child of Rowan · <span class="warn">needs you</span></small></div><span style="margin-left:auto">›</span></a>`;
const terminal=()=>`<div class="terminal"><div class="session-line"><span class="dot"></span><b>Rowan</b><span class="muted">Northstar · Local</span><span class="synced">✓ Last synced just now</span></div><div class="terminal-output"><p>Reviewing the welcome brief.</p><p>I’ll keep the first action clear and move the detail below it.</p><p><span class="green">Updated</span> docs/welcome-brief.md</p><p class="grey">Checking the revised copy…</p><p class="cursor">▌</p></div><div class="composer"><a href="#${target('m13')}" class="composer-input">Draft thy decree… ${glyph('mic')}</a>${link('m13','Send','quiet send')}</div></div>`;
const paper=()=>`<div class="paper"><div class="caps" style="color:#54736b">Northstar / design brief</div><div class="rule"></div><h2>A good beginning<br>feels effortless.</h2><p>Let people take one clear next step. Keep the explanation nearby, without making it the first thing they must read.</p><div class="sample-art"><b>Welcome to Northstar</b><p>Your workspace is ready.</p><span>Open your first task →</span></div><p><b>What we will review</b><br>A clear first action, readable material previews, and a reliable route back to the work.</p><small style="color:#64766d">Fictional sample · design concept</small></div>`;
const filters=()=>`<div class="stack"><label class="search">⌕ <input aria-label="Search task titles" placeholder="Search task titles" style="border:0;padding:0;background:transparent"></label><div class="caps">Task status · choose one</div><div>${['All','Not started','Started','Agents running','Needs attention','Failed or blocked','Unknown'].map((n,i)=>`<label class="filter-option"><input type="radio" name="status" ${i===3?'checked':''}>${n}</label>`).join('')}</div><label class="filter-option"><input type="checkbox">Has materials</label><p class="muted" style="font-size:12px">Search AND status AND materials. Viewing preferences never move tasks.</p>${link('m04','Apply filters','button primary')}</div>`;
function content(kind){switch(kind){
case 'workspace':return `<div class="stack"><p class="muted">Your work stays in its workspace.</p><a class="card selected" href="#m02"><div class="row between"><h2>Northstar</h2><span>→</span></div><p>Design and build a thoughtful first run.</p><div class="row" style="margin-top:16px"><span class="tag live">2 agents working</span><span class="tag">1 question</span></div></a><div class="card"><h3>Field notes</h3><p>Personal ideas and experiments</p></div><p class="hero-note">All workspaces, tasks and people in this concept are fictional.</p></div>`;
case 'board':case 'light':return `${current.platform==='desktop'?`<div class="mode-switch">${link('m02','Notepad')}${link('m24','Rituals')}</div>`:''}${current.phase==='1B'?chips():''}${board()}`;
case 'filters':return filters();
case 'running':return `${chips()}<div class="notice" style="margin-top:15px">2 matching tasks · 1 associated question</div>${board(true)}<a class="card" href="#m19" style="display:block;margin-top:15px"><div class="caps warn">Needs your attention</div><h3 style="margin-top:7px">Mira has a question</h3><p>Welcome screen feels clear →</p></a>`;
case 'task':case 'overview':return `${tabs('Overview')}<div class="card"><div class="row between"><span class="tag">Pending coding</span><span class="tag live">Working</span></div><h2 style="margin:14px 0">Welcome screen feels clear</h2><p>One clear first action. Keep the explanation close, and make the task materials easy to review.</p></div><div class="row" style="margin:15px 0">${link('m06','5 materials','button')}${link('m11','2 agents','button')}</div><div class="caps">Associated agents</div>${agents()}<p class="hero-note">Reading a task does not start, move or complete it.</p>`;
case 'materials':return `${tabs('Materials')}<div class="row between"><div class="caps">Welcome screen · 5 materials</div>${link('m17','+ Add','button small')}</div>${materialRows()}<p class="hero-note">A copied file, a live document and a URL keep their distinct meanings.</p>`;
case 'pdf':return `<div class="row between"><span class="tag">Attachment · copied 4 Oct</span>${link('m06','Materials','button small')}</div><div class="viewer-tools">${btn('‹','Previous PDF page')}<span>Page 2 / 4</span>${btn('›','Next PDF page')}${btn('100%','PDF zoom controls')}${btn('↗','Expand the reader')}</div>${paper()}`;
case 'document':return `<div class="stack"><div class="notice">Live workspace document<br><b>welcome-brief.md</b> · current source</div><div class="card"><div class="caps">Last edited just now · Rowan</div><h2 style="margin:17px 0">A clear first step</h2><p>The welcome screen offers one main action: open your first task.</p><h3 style="margin-top:20px">Acceptance notes</h3><p>• The next action is easy to find.<br>• Materials open in context.<br>• Returning restores the task.</p><p class="muted">This live revision can be newer than the copied PDF.</p></div>${link('m13','Discuss this revision','button')}</div>`;
case 'video':return `<div class="stack"><span class="tag">Attachment · MP4 · fictional player state</span><div class="player-stage"><div class="caps">Northstar / experience preview</div><h2>A calmer first minute.</h2>${btn('▶','Concept player. The narrated review videos are available from the review page.','play')}<small>Paused · press play deliberately</small></div><div><div class="progressline"></div><div class="row between"><small>00:34</small><small>02:14</small></div></div><div class="row between">${btn('▶ Play','Play the selected attached MP4')}${btn('Volume','Player volume')}${btn('Expand','Expand playback')}</div><div class="notice">In-app playback is Stage 1.<br>No autoplay when you enter or return.</div></div>`;
case 'audio':return `<div class="stack"><span class="tag">Attachment · MP3</span><div class="card" style="padding:26px 20px"><div class="caps">A narrated brief</div><h2 style="margin-top:12px">Listen to the proposal</h2><div class="wave">${Array.from({length:31},(_,i)=>`<i style="height:${18+Math.round(63*Math.abs(Math.sin(i*.84)))}px"></i>`).join('')}</div><div class="progressline"></div><div class="row between"><small>00:24</small><small>01:32</small></div><div class="row" style="justify-content:center;margin-top:22px">${btn('−10s','Seek back ten seconds')}${btn('▶ Play','Play the selected attached audio file','primary')}${btn('+10s','Seek forward ten seconds')}</div></div><div class="notice">Leaving this viewer stops playback. Return, then press Play to resume.</div><p class="hero-note">MP3, M4A/AAC and WAV PCM in Stage 1. Media creation stays separate.</p></div>`;
case 'agents':return `${tabs('Agents')}<div class="caps">Real task associations</div>${agents()}<div class="notice" style="margin-top:22px">Selecting an agent opens that exact session. Ended or unknown links are shown honestly.</div>${link('m12','Continue with Rowan','button primary')}<p class="hero-note">The child relationship shown here is a fictional example of proven ancestry.</p>`;
case 'terminal':return `${terminal()}<div class="row between" style="margin-top:16px"><span class="tag">Local · Northstar</span>${link('m05','Back to task','button small')}</div>`;
case 'compose':return `<div class="stack"><div class="notice">To Rowan · existing local session<br>Task: Welcome screen feels clear</div><label><div class="caps" style="margin-bottom:9px">Your instruction</div><textarea rows="6">Please shorten the introduction in welcome-brief.md. Keep the first action clear and move the detail below it.</textarea></label><div class="row">${link('m14','Send to Rowan','button primary')}${link('m12','Cancel','button')}</div><p class="hero-note">This reuses the existing agent conversation. It does not create a new feedback database.</p></div>`;
case 'progress':return `<div class="stack"><div class="notice">✓ Instruction delivered to Rowan</div><div class="card"><div class="row"><span class="dot"></span><h3>Rowan is working</h3></div><p>Revising welcome-brief.md</p><div class="progressline"></div><small>Activity is live; acceptance remains yours.</small></div>${agents()}${link('m08','Review the live document','button primary')}<p class="hero-note">No automatic board move or completion.</p></div>`;
case 'launch':return `<div class="stack"><div class="notice amber">Not started · opening this sheet starts nothing</div><div class="card stack"><h2>A calmer first minute</h2><label>Agent<select><option>Existing configured agent</option></select></label><label>Workspace<input value="Northstar" readonly></label><label>Target<select><option>Local workspace</option><option>Configured remote workspace</option></select></label>${btn('Use existing start action','In the real product, configured board rules and the explicit launch action decide when work starts.','primary')}</div><p class="hero-note">For Thy Quill, moving to Pending coding is the configured work signal.</p></div>`;
case 'edit':return `<div class="stack"><div class="row">${link('m05','Task details','button')}${link('m17','Add resource','button')}</div><label>Task label<textarea rows="3">Welcome screen feels clear</textarea></label><label>Section<select><option>Pending coding</option><option>Backlog</option></select></label><div class="row">${link('m05','Save','button primary')}${link('m05','Cancel','button')}</div><div class="notice">Draft changes are deliberate. The task identity and its resources stay together.</div></div>`;
case 'add':return `<div class="stack">${[['Attachment','Copy a file snapshot to this task.','m06'],['Workspace document','Bind a live file in this workspace.','m08'],['Public URL','Name an HTTP or HTTPS destination.','m18']].map(([h,p,id])=>`<a class="card" href="#${id}"><h2>${h} <span style="float:right">›</span></h2><p>${p}</p></a>`).join('')}<p class="hero-note">Choose the meaning first. Resource kinds are never silently converted.</p></div>`;
case 'url':return `<div class="stack"><span class="tag">Public URL</span><div class="card"><h2>Reference gallery</h2><p>https://example.com</p><p class="muted">This destination opens only when you choose.</p></div><a class="button primary" href="https://example.com" target="_blank" rel="noopener noreferrer">Open destination ↗</a>${link('m06','Back to materials','button')}<p class="hero-note">No automatic download or conversion into an attachment.</p></div>`;
case 'attention':return `<div class="stack"><div class="notice amber">Mira needs your answer<br>Child of Rowan · Welcome screen feels clear</div><div class="card"><h2>Which wording should I use?</h2><p>“Open your first task” is clearer, but “Get started” is shorter.</p><p>Would you like the clearer version?</p></div>${link('m13','Reply to the exact session','button primary')}${link('m05','Open task context','button')}<div class="row"><span class="dot"></span><small>Rowan continues working</small></div></div>`;
case 'outside':return `<div class="stack"><div class="notice amber">This task is outside “Agents running”. Your open material stays here.</div><div class="row">${link('m02','Reveal task','button primary')}${link('m02','Clear filter','button')}</div><div class="card"><div class="caps">Still selected</div><h2 style="margin-top:12px">Welcome screen feels clear</h2><p>Rowan finished. Your brief remains open.</p></div>${paper()}</div>`;
case 'empty':return `<div class="stack">${chips()}<div class="search">⌕ onboarding · Has materials</div><div class="empty"><div class="big">⌕</div><h2>No matching tasks</h2><p class="hero-note">Your tasks are still here. Try a different status or clear the search.</p>${link('m02','Clear filters','button primary')}</div></div>`;
case 'offline':return `<div class="stack"><div class="notice amber">Offline · agent status unavailable</div><div class="card"><h2>Welcome screen feels clear</h2><p><span class="tag">Started before</span> <span class="tag warn">Live status unknown</span></p><p>Last known task context is available. No new delivery is claimed.</p></div>${link('m07','Read an available local copy','button')}${btn('Check connection','The real app would refresh its existing connectivity state.')}<p class="hero-note">Unknown is not “Not started”.</p></div>`;
case 'error':return `<div class="stack"><span class="tag">Attachment · preview.mov</span><div class="empty card"><div class="big warn">!</div><h2>This format cannot play here</h2><p class="hero-note">This sample uses an unsupported codec. No playback has started.</p>${btn('Open externally','Deliberate fallback to an available external application.','primary')}</div>${link('m06','Choose another material','button')}<div class="notice">A download failure would offer Retry. An external fallback does not prove supported in-app playback.</div></div>`;
case 'rituals':return `${current.platform==='desktop'?`<div class="mode-switch">${link('m02','Notepad')}${link('m24','Rituals')}</div>`:''}<div class="card selected" style="margin-top:18px"><div class="row between"><h2>Daily summary</h2><span class="tag live">Enabled</span></div><p>Every weekday · 09:00</p><p>Latest occurrence: completed execution</p>${link('m25','Open definition →','button small')}</div><div class="card"><h3>Weekly review</h3><p>Friday · 16:00</p></div><div class="notice" style="margin-top:20px">Definition, occurrence, materials and agents switch together.</div>`;
case 'schedule':return `<div class="stack"><div class="card"><div class="caps">Existing scheduler definition</div><h2 style="margin-top:12px">Daily summary</h2><p>Summarise the previous day’s task activity and highlight open questions.</p></div><div class="card"><h3>Weekdays · 09:00</h3><p>Europe/London · Northstar</p>${btn('Edit schedule','Uses the existing explicit scheduler edit and save.','small')}</div>${link('m26','Today’s occurrence →','button primary')}<p class="hero-note">Reading a report changes neither the schedule nor the next delivery.</p></div>`;
case 'occurrence':return `<div class="stack"><span class="tag live">Execution completed · 09:02</span><div class="card"><h2>Today’s summary</h2><p>2 tasks progressed. 1 question remains.</p><p>Your review determines whether the report is useful.</p>${link('m08','Read the report','button')}</div><div class="card"><h3>Associated run</h3><p>Rowan · ended after delivery</p>${link('m27','View retained summary','button small')}</div></div>`;
case 'retained':return `<div class="stack"><div class="notice">Live session ended. Retained output is available.</div><div class="card"><h2>Daily summary delivered</h2><p>09:00 — occurrence started<br>09:02 — report saved<br>09:02 — execution ended</p></div>${link('m08','Read the retained report','button primary')}<p class="hero-note">A missing full transcript is not presented as a complete conversation archive.</p></div>`;
case 'control':return `<div class="stack"><div class="row between"><span class="tag">Repository · all changes</span><span class="tag">2 files</span></div><div class="card"><h3>welcome-brief.md</h3><p>3 additions · 2 removals</p></div><div class="diff"><span class="muted">@@ Welcome message @@</span><br><span class="remove">− Get started with all the tools.</span><span class="add">+ Open your first task.</span><br> Keep the details close.</div><div class="row">${btn('Review changes','Uses existing repository review controls.','primary')}${link('d13','History','button')}</div><p class="hero-note">Repository scope remains independent of the selected task.</p></div>`;
case 'chronicle':return `<div class="stack"><div class="tag">Repository history · read only</div><div class="timeline">${[['Today, 10:42','Clarify the welcome message'],['Today, 09:18','Keep materials in task context'],['Yesterday, 16:30','Improve the first-run layout']].map(([t,n])=>`<div><small>${t}</small><h3>${n}</h3><p class="hero-note">Fictional revision · inspect changes</p>${link('d10','View diff','button small')}</div>`).join('')}</div><p class="hero-note">Chronicle is repository history, not captured agent conversation history.</p></div>`;
case 'settings':return `<div class="stack"><div class="settings-row"><span>Account</span><span>›</span></div><div class="settings-row"><span>Notifications</span><span>›</span></div><div class="settings-row"><span>Dictation</span><span>›</span></div><div class="settings-row"><span>Sync</span><span class="live">Connected</span></div><div class="settings-row"><span>About</span><span>›</span></div><p class="hero-note">Existing settings route. This draft keeps the current appearance.</p></div>`;
case 'scrolls':return `<div class="stack"><div class="search">⌕ Search open files</div><div class="card"><a class="material" href="#m08"><span class="fileicon">MD</span><div><b>Welcome brief</b><small>docs/welcome-brief.md</small></div><span class="arrow">›</span></a><a class="material" href="#m07"><span class="fileicon">PDF</span><div><b>Welcome brief.pdf</b><small>Task attachment · copied snapshot</small></div><span class="arrow">›</span></a></div><p class="hero-note">Workspace files remain accessible outside the selected task.</p></div>`;
case 'polish':return `<div class="stack"><h2>The working layout first</h2><p>Keep the current Classic appearance throughout Stage 1.</p><div class="card"><h3>Then refine the same components</h3><p>Icons, spacing, typography, density, responsive behaviour and accessibility consistency.</p></div><p class="hero-note">Stage 2 is deferred. This frame deliberately uses the current UI; it is not a proposed replacement skin.</p></div>`;
case 'notifications':return `<div class="stack"><a class="card selected" href="#m19"><div class="caps warn">Needs your answer · just now</div><h2 style="margin-top:13px">Mira has a question</h2><p>Welcome screen feels clear · Northstar</p><p>Open the exact task and session →</p></a><div class="card"><div class="caps">Ready to review</div><h3 style="margin-top:12px">A smoother sign-in</h3><p>Evidence is available. Your acceptance is pending.</p></div><p class="hero-note">A destination outside the active filter is revealed without switching to another task.</p></div>`;
case 'review':return `<div class="stack"><div class="notice">Agent finished. Your review remains.</div><div class="card"><h2>Welcome screen feels clear</h2><p>Review the latest brief, changed code and the evidence relevant to this task.</p><div class="row" style="margin-top:15px">${link('m08','Read material','button small')}${link('m11','Discuss with agent','button small')}</div></div><div class="card"><h3>You decide when it is done</h3><p>The actual product would use your deliberate completion or clearing action.</p></div><p class="hero-note">These HTML concepts are not product QA. Implementation and real acceptance remain open.</p></div>`;
default:throw new Error('Unknown view '+kind);}}
function mobile(s){const tab=['agents','terminal','compose','progress','attention'].includes(s.kind)?'Minions':['rituals','schedule','occurrence','retained'].includes(s.kind)?'Rituals':s.kind==='notifications'?'Omens':s.kind==='scrolls'?'Scrolls':'Thy Quill';const isBoard=s.kind==='board';return `<div class="phone"><header class="appbar"><a href="#m01" class="workspace-picker"><span class="workspace-dot"></span><span>Northstar</span><span class="chevron">▾</span></a><div class="row">${['terminal','agents'].includes(s.kind)?`${btn('▥','Existing voice mode.','quiet')}${btn('+','Existing launch control.','quiet')}`:`${btn(glyph('refresh'),'Use the existing sync control.','quiet')}${link('m30',glyph('gear'),'quiet')}`}</div></header><section class="content ${s.kind==='terminal'?'terminal-screen':''}">${title(s)}${s.kind==='terminal'?'<div class="native-agent-bar"><span>☁ <b>Rowan</b> · Northstar　⌄</span><span class="live">●</span><span>⋮</span></div>':''}${content(s.kind)}${isBoard?link('m16','+','fab'):''}</section><nav class="bottom-nav" aria-label="Existing mobile navigation">${[['m02','home','Thy Quill'],['m11','robot','Minions'],['m34','doc','Scrolls'],['m24','clock','Rituals'],['m32','skull','Omens']].map(([id,icon,n])=>`<a href="#${id}" class="${n===tab?'active':''}"><span class="navicon">${icon==='skull'?'<span class="skull">☠&#xfe0e;</span>':glyph(icon)}</span><span>${n}</span></a>`).join('')}</nav><div class="tourbar"><button class="small" data-chapters>☷</button><div class="tour-label"><b>${phaseText(s)}</b><small>HTML draft · ${mobileIds().findIndex(x=>x.id===s.id)+1}/${mobileIds().length}</small></div>${link(s.next,'Next →','button small')}</div></div>`}
function desktop(s){const isExisting=s.phase==='1A';const mode=s.kind==='control'?'CONTROL':s.kind==='chronicle'?'CHRONICLE':'COMMAND';let centre=s.kind==='overview'?'document':['filters','agents','terminal'].includes(s.kind)?'document':s.kind;return `<div class="desk ${s.kind==='terminal'?'expanded-terminal':''}"><header class="desk-head">${btn('‹ Summon','Existing Summon / Commence sheet.','summon')}<span class="workspace-name">NORTHSTAR</span><span class="toolbar-history">‹　›</span><nav><span>⚔</span>${[['d01','COMMAND'],['d10','CONTROL'],['d13','CHRONICLE']].map(([id,n])=>link(id,n,n===mode?'active':'')).join('')}<span>⚔</span></nav><span class="global-status">cloud　main　▰ Local</span>${link('d14',glyph('gear'),'quiet')}</header><div class="desk-body"><aside class="desk-left"><div class="panel-heading"><span>◉ THY QUILL (${groups.reduce((n,g)=>n+g[1].length,0)})</span><div>${link('m16','+','quiet')}${link('d02','⌕','quiet')}</div></div>${!isExisting?`<div class="mode-switch">${link('d01','Notepad')}${link('d09','Rituals')}</div><div class="search">⌕ Search tasks</div><div class="chips" style="margin-top:8px">${link('d02',s.kind==='outside'?'Running':'All tasks ▾','button chip active')}${link('d04','Has materials','button chip')}</div>`:''}${s.kind==='filters'?`<div class="card filter-menu">${['All','Not started','Started','Agents running','Needs attention','Failed or blocked','Unknown'].map(n=>`<div>${n}</div>`).join('')}</div>`:s.kind==='rituals'?content('rituals'):board()}${s.kind==='outside'?'<div class="notice amber">Selected task outside filter.<br><a href="#d01"><u>Reveal task</u></a></div>':''}</aside><section class="desk-centre"><div class="file-tabs"><span>♧ welcome-brief.md</span>${link('d03','Preview','active')}${btn('Raw','Existing raw file view.','small')}${btn('Review','Existing document review action.','small')}${btn('Export PDF','Existing export action.','small')}<span style="margin-left:auto">⋯　×</span></div>${!isExisting?`<div class="task-context"><span>Welcome screen feels clear</span>${link('d04','Materials (5)','button small')}</div>`:''}<div class="viewer-content">${title(s)}${content(centre)}</div></section><aside class="desk-right"><div class="inspector"><div class="panel-heading"><span>${isExisting?'☷ QUESTS (2)':'☷ TASK AGENTS (2)'}</span>${btn('+','Existing agent launch control.','small')}</div>${agents()}<div class="panel-heading secondary">◷ RITUALS　${link('d09','Open','quiet')}</div><div class="panel-heading secondary">▤ SCROLLS　${link('d04','Open','quiet')}</div></div><div class="terminal-pane"><div class="terminal-tabs"><span class="terminal-tab">◉ 1: Rowan — Northstar <span>×</span></span>${btn('+','Existing new terminal control.','small')}${link('d08','Expand','button small')}</div>${terminal()}</div></aside></div><footer class="desk-footer"><span>HTML draft · ${phaseText(s)} · current UI baseline</span><div class="row"><span>${desktopIds().findIndex(x=>x.id===s.id)+1} / ${desktopIds().length}</span><button class="small" data-chapters>Phases &amp; chapters</button>${link(s.next,'Next view →','button small')}</div></footer></div>`}
function render(){let id=location.hash.slice(1)||'m01';current=scenes.find(s=>s.id===id)||scenes[0];document.body.classList.remove('light');document.body.classList.toggle('desktop-mode',current.platform==='desktop');app.innerHTML=current.platform==='mobile'?mobile(current):desktop(current);if(current.platform==='desktop')app.querySelectorAll('a[href^="#"]').forEach(a=>a.hash=target(a.hash.slice(1)));document.title=current.title+' — Silver Citadel concept';document.querySelector('#chapters').hidden=true;document.querySelector('.content')?.scrollTo(0,0);window.scrollTo(0,0);app.dataset.scene=current.id;}
function chapters(){const p=document.querySelector('#chapters');p.innerHTML=`<div class="row between"><div><div class="caps">Design review · 4 October 2026</div><h2>Every proposed journey</h2></div><button data-close>Close</button></div><div class="phase-grid">${phases.map(p=>`<div class="card"><b>Stage ${p.id} · ${esc(p.title)}</b><p>${esc(p.scope)}</p><small>Exit: ${esc(p.exit)}</small></div>`).join('')}</div><p class="hero-note">Navigate freely. These are fictional HTML concepts; no action changes a real task.</p>${['mobile','desktop'].map(platform=>`<h2>${platform==='mobile'?'Mobile · '+mobileIds().length+' screens':'Desktop · '+desktopIds().length+' views'}</h2><div class="chapter-grid">${scenes.filter(s=>s.platform===platform).map(s=>`<a href="#${s.id}">${s.id.toUpperCase()} · ${esc(s.title)}<small>Stage ${s.phase}</small></a>`).join('')}</div>`).join('')}`;p.hidden=false;}
document.addEventListener('click',e=>{let el=e.target.closest('[data-chapters],[data-close],[data-note]');if(!el)return;if(el.hasAttribute('data-chapters'))chapters();else if(el.hasAttribute('data-close'))document.querySelector('#chapters').hidden=true;else{document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=el.dataset.note;document.body.append(t);setTimeout(()=>t.remove(),4200)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#chapters').hidden=true});
window.addEventListener('hashchange',render);
(async()=>{const data=window.S157_SCENES||(await(await fetch('scenes.json')).json());scenes=data.scenes;phases=data.phases;render();window.S157_READY=true})().catch(e=>{app.textContent='Unable to load concept scenes: '+e.message});
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Silver Citadel — concept journeys</title><style>*{box-sizing:border-box} :root{color-scheme:dark;--bg:#11191e;--panel:#19242b;--raised:#223039;--line:#35434a;--text:#eef2ed;--muted:#a9b7bc;--accent:#9ed7c5;--gold:#eac78b;--ink:#142c26}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Noto Color Emoji",sans-serif}body.light{color-scheme:light;--bg:#edf0eb;--panel:#fffdf8;--raised:#e7ece7;--line:#c9d3cb;--text:#1e3431;--muted:#566d67;--accent:#276d5b;--gold:#85602c;--ink:#fff}button,a,input,textarea,select{font:inherit}a{color:inherit;text-decoration:none}button,.button{background:var(--raised);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px}button:hover,a:hover{filter:brightness(1.12)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.primary{background:var(--accent);color:var(--ink);font-weight:700;border-color:transparent}.quiet{background:transparent;border:0;padding:8px}.small{font-size:12px;min-height:36px;padding:7px 10px}.tag{display:inline-block;background:var(--raised);padding:3px 8px;border-radius:5px;font-size:11px;letter-spacing:.02em;color:var(--muted)}.live{color:var(--accent)}.warn{color:var(--gold)}.caps{text-transform:uppercase;font-size:10px;letter-spacing:.15em;color:var(--muted);font-weight:650}.muted,small{color:var(--muted)}h1,h2,h3,p{margin:0}h1{font-size:27px;line-height:1.13;letter-spacing:-.035em}h2{font-size:21px;line-height:1.23;letter-spacing:-.02em}h3{font-size:15px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.stack{display:grid;gap:14px}.wrap{flex-wrap:wrap}.divider{border-bottom:1px solid var(--line)}.logo{width:30px;height:32px;border:1px solid var(--accent);display:grid;place-items:center;color:var(--accent);border-radius:7px;font-size:18px}.appbar{height:62px;padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--panel)}.concept{font-size:10px;letter-spacing:.1em;color:var(--gold);border:1px solid #8d7750;padding:3px 6px;border-radius:4px}.phone{max-width:480px;margin:0 auto;height:100dvh;min-height:680px;display:flex;flex-direction:column;background:var(--bg)}.statusbar{height:23px;padding:2px 20px;display:flex;justify-content:space-between;font-size:10px;background:var(--panel)}.phone .content{flex:1;overflow:auto;min-height:0;padding:19px 18px}.phone .title{margin-bottom:18px}.phone .title h1{margin:6px 0 8px}.phone .title p{font-size:12px;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}.card.selected{border-color:var(--accent)}.card p{font-size:13px;margin-top:8px}.card+ .card{margin-top:10px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border-radius:20px;min-height:36px;font-size:12px;padding:7px 12px}.chip.active{background:var(--accent);color:var(--ink);font-weight:700}.search{display:flex;gap:8px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;font-size:13px;color:var(--muted)}input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px}input[type=radio],input[type=checkbox]{width:auto;accent-color:var(--accent);margin-right:10px}.filter-option{padding:10px 0;display:block;font-size:13px;border-bottom:1px solid var(--line)}.board{margin-top:15px}.bucket{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:650;color:var(--muted);padding:13px 0 5px}.task-row{display:flex;align-items:center;gap:9px;padding:10px 9px;border-radius:8px;font-size:12px;min-height:44px}.task-row.chosen{background:var(--raised);box-shadow:inset 2px 0 var(--accent)}.task-row .label{flex:1}.task-row .sub{font-size:10px;color:var(--muted);display:block;margin-top:1px}.dot{width:7px;height:7px;background:var(--accent);border-radius:100%;flex-shrink:0}.dot.amber{background:var(--gold)}.dot.grey{background:#899398}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:16px}.tabs a{font-size:12px;flex:1;text-align:center;padding:8px;border-radius:7px}.tabs a.active{color:var(--accent);background:var(--raised)}.bottom-nav{display:flex;justify-content:space-around;padding:9px 5px max(10px,env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);flex-shrink:0}.bottom-nav a{font-size:10px;color:var(--muted);display:grid;text-align:center;gap:2px;min-width:64px;min-height:43px}.bottom-nav span{font-size:18px}.bottom-nav .active{color:var(--accent)}.tourbar{background:var(--bg);padding:10px 18px;border-top:1px solid var(--line);display:flex;gap:7px;align-items:center}.tourbar .primary{font-size:12px;flex:1;min-height:42px}.tourbar .counter{font-size:10px;color:var(--muted);white-space:nowrap}.material{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}.fileicon{width:36px;height:42px;background:var(--raised);color:var(--accent);display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;font-size:11px;font-weight:700}.material .name{font-size:13px;font-weight:600}.material small{display:block;font-size:10px;margin-top:3px}.material .arrow{margin-left:auto;color:var(--muted)}.paper{background:#f7f5ef;color:#233835;padding:25px 24px;border-radius:3px;box-shadow:0 6px 24px #0003;min-height:345px}.paper h2{font-size:25px;font-family:Georgia,serif;line-height:1.16;margin:15px 0}.paper p{font-size:12px;line-height:1.65;margin:12px 0}.paper .rule{height:3px;width:32px;background:#4e9380;margin:16px 0}.paper .sample-art{background:#d6e5dc;padding:24px;border-radius:7px;margin:15px 0}.paper .sample-art span{display:block;background:#275e50;color:white;padding:10px;border-radius:6px;font-size:12px;text-align:center;margin-top:12px}.viewer-tools{display:flex;justify-content:space-between;align-items:center;margin:13px 0;gap:6px;font-size:11px}.viewer-tools button{min-height:36px;padding:5px 10px}.notice{background:#31413b;color:#d9eddf;padding:12px;border-radius:9px;font-size:12px;border-left:3px solid var(--accent)}.notice.amber{background:#3a3328;color:#f0dcb4;border-color:var(--gold)}.light .notice{background:#d7e8df;color:#234d40}.agent{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.avatar{height:37px;width:37px;border-radius:10px;display:grid;place-items:center;background:#315449;color:#d9f2e6;font-size:17px}.agent small{font-size:11px;display:block;margin-top:3px}.terminal{background:#0c1217;border:1px solid #34434a;border-radius:8px;color:#d1e0d9;padding:16px;font:12px/1.8 'DejaVu Sans Mono',monospace;min-height:250px;overflow:auto}.terminal .green{color:#91ceb0}.terminal .grey{color:#8e9fa6}.terminal p{margin:10px 0}.terminal .prompt{border-top:1px solid #34434a;padding-top:12px;margin-top:15px}.terminal textarea{font:inherit;color:#d1e0d9;background:#111b20}.player-stage{background:linear-gradient(135deg,#315749,#19292f);aspect-ratio:16/10;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px;text-align:center}.player-stage .play{border-radius:50%;width:58px;height:58px;color:var(--ink);background:var(--accent);font-size:22px}.wave{height:98px;display:flex;gap:5px;align-items:center;justify-content:center;margin:22px 0}.wave i{display:block;width:5px;border-radius:5px;background:var(--accent)}.progressline{height:4px;background:var(--line);margin:16px 0 7px;border-radius:3px}.progressline:before{content:'';display:block;width:26%;height:4px;background:var(--accent)}.diff{font:12px/1.7 monospace;background:var(--bg);padding:14px;border:1px solid var(--line);border-radius:8px}.diff .add{color:#a3d6b2;background:#18382c;display:block}.diff .remove{color:#efb4a0;background:#432b29;display:block}.timeline{border-left:1px solid var(--line);padding-left:20px;display:grid;gap:18px}.timeline small{font-size:11px;display:block}.empty{text-align:center;padding:36px 12px}.empty .big{font-size:38px;color:var(--accent);margin-bottom:17px}.desk{height:100dvh;min-width:1000px;display:flex;flex-direction:column}.desk-head{height:65px;display:flex;align-items:center;padding:0 22px;gap:25px;background:var(--panel);border-bottom:1px solid var(--line)}.desk-head nav{display:flex;gap:8px;margin:auto}.desk-head nav a{padding:10px 18px;font-size:13px}.desk-head .active{background:var(--raised);border-radius:8px;color:var(--accent)}.desk-body{display:grid;grid-template-columns:290px minmax(400px,1fr) 370px;flex:1;min-height:0}.desk-left,.desk-centre,.desk-right{overflow:auto}.desk-left{border-right:1px solid var(--line);padding:20px 17px}.desk-centre{padding:24px;background:var(--bg)}.desk-right{border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}.desk-centre .paper{max-width:600px;min-height:470px;margin:18px auto;padding:35px 48px}.desk-centre .paper h2{font-size:35px}.desk-centre .paper p{font-size:15px}.desk-centre .title{margin-bottom:19px}.desk-centre .title h1{margin:8px 0}.desk-centre .player-stage{margin-top:30px;aspect-ratio:16/9}.inspector{padding:20px;flex:0 0 255px}.terminal-pane{border-top:1px solid var(--line);padding:17px;flex:1;min-height:0}.terminal-pane .terminal{height:calc(100% - 42px);margin-top:10px}.desk-footer{height:43px;background:var(--panel);border-top:1px solid var(--line);padding:5px 17px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}.desk-footer button{min-height:30px}.desk .board .task-row{font-size:12px}.desk .board .bucket{padding-top:15px}.chapter-panel{position:fixed;inset:12px;z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;overflow:auto;box-shadow:0 0 0 20px #0008}.chapter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:8px;margin:18px 0}.chapter-grid a{padding:12px;border:1px solid var(--line);border-radius:8px;font-size:13px}.chapter-panel[hidden]{display:none}.toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);max-width:90%;padding:15px;background:var(--text);color:var(--bg);border-radius:10px;z-index:20;font-size:13px;text-align:center}.desk .material{padding:17px 0}.hero-note{margin:15px 0;font-size:12px;color:var(--muted)}.mode-switch{display:flex;gap:7px}.mode-switch a{font-size:12px;padding:8px;border-radius:7px;background:var(--raised)}@media(max-width:650px){.desk{min-width:1000px}.chapter-panel{inset:6px}.phone .card{padding:13px}}

.expanded-terminal .desk-body{grid-template-columns:260px 350px minmax(500px,1fr)}.expanded-terminal .inspector{flex-basis:165px;padding:15px}.expanded-terminal .inspector .agent{padding:6px 0}.expanded-terminal .terminal{font-size:15px}.expanded-terminal .desk-centre .paper{padding:22px}.expanded-terminal .desk-centre .title h1{font-size:23px}
</style></head><body><main id="app"></main><aside id="chapters" class="chapter-panel" hidden aria-label="Concept chapter index"></aside><script>window.S157_SCENES={"title": "Silver Citadel \u2014 proposed mobile and desktop journeys", "date": "2026-10-04", "scope": "HTML design concepts, not implemented product or QA evidence", "scenes": [{"id": "m01", "platform": "mobile", "title": "Choose your workspace", "subtitle": "Start with the right context", "kind": "workspace", "next": "m02", "action": "Open Northstar", "narration": "Begin with a workspace, so tasks, files and agents all share the same context. This is a proposed experience built from HTML, not a recording of the released app. We will follow one piece of work from discovery through review."}, {"id": "m02", "platform": "mobile", "title": "Your work, at a glance", "subtitle": "Command \u00b7 Notepad", "kind": "board", "next": "m03", "action": "Filter tasks", "narration": "Command opens on your task list. The seven Thy Quill sections stay in their existing order. Short labels keep the list scannable. Status and material indicators tell you where something is happening without turning each row into a report."}, {"id": "m03", "platform": "mobile", "title": "Find the work you need", "subtitle": "One status, plus useful refinements", "kind": "filters", "next": "m04", "action": "Apply filters", "narration": "Choose one status filter, then optionally add text search and Has materials. Started means work began before. Agents running means someone is executing now. Needs your attention is an actual question or request, not a guess based on an idle terminal."}, {"id": "m04", "platform": "mobile", "title": "Only the active work", "subtitle": "Agents running \u00b7 2 matches", "kind": "running", "next": "m05", "action": "Open Welcome screen", "narration": "Here are the tasks with agents running. A child asking a question stays visible alongside its working parent. Unknown status has its own route. Filtering changes what you see; it never moves a row or starts an agent."}, {"id": "m05", "platform": "mobile", "title": "One task, everything together", "subtitle": "Welcome screen feels clear", "kind": "task", "next": "m06", "action": "Open Materials", "narration": "Open the task through its explicit detail action. The brief, materials and associated agents now belong to one place. Editing and dragging the board row keep their existing routes. The agent can keep working while you review what it produced."}, {"id": "m06", "platform": "mobile", "title": "A shelf for what already exists", "subtitle": "Copies, live files and destinations", "kind": "materials", "next": "m07", "action": "Read the brief", "narration": "The material shelf reuses attachments, workspace documents and public links already bound to this task. Their labels make the difference clear: an attachment is a copied snapshot, a workspace document stays live, and a public link opens only when you choose it."}, {"id": "m07", "platform": "mobile", "title": "Read the PDF in the task", "subtitle": "Brief.pdf \u00b7 page 2 of 4", "kind": "pdf", "next": "m08", "action": "Read the live document", "narration": "Read an ordinary PDF without leaving the task. Page controls and zoom are easy to reach. The copied brief keeps its revision label. Returning to materials keeps your task and reading context, rather than making you find the row again."}, {"id": "m08", "platform": "mobile", "title": "Know when a document is live", "subtitle": "Workspace document \u00b7 current source", "kind": "document", "next": "m09", "action": "Watch the walkthrough", "narration": "A workspace document is visibly live. Its current revision may be newer than the copied PDF. That distinction matters when you comment on a specific version. The interface should show freshness honestly instead of calling every file the latest."}, {"id": "m09", "platform": "mobile", "title": "Watch without leaving the task", "subtitle": "Walkthrough.mp4 \u00b7 video player", "kind": "video", "next": "m10", "action": "Listen to the audio", "narration": "Video playback belongs in Stage One. An MP4 opens inside the material view, with play, pause, seeking, elapsed time, volume and an expand action. Playback begins deliberately. Unsupported or unavailable media gets an honest explanation, not a pretend loaded player."}, {"id": "m10", "platform": "mobile", "title": "Listen to the same material", "subtitle": "Brief narration.mp3 \u00b7 audio player", "kind": "audio", "next": "m11", "action": "See associated agents", "narration": "Audio gets a proper player too, using the existing attached file. You can pause, seek and replay. Leaving the phone player releases playback. Coming back never starts hidden sound automatically. Generating new narration is a separate capability from playing what is already attached."}, {"id": "m11", "platform": "mobile", "title": "Reach the agent doing this work", "subtitle": "Two associated agents", "kind": "agents", "next": "m12", "action": "Open Rowan\u2019s terminal", "narration": "The agent list uses proven task associations. Rowan is the lead, and Mira is a real child in this fictional example. Selecting an agent opens that exact existing session. Unknown or ended associations are explained; opening the task never silently launches a replacement."}, {"id": "m12", "platform": "mobile", "title": "Continue the actual conversation", "subtitle": "Rowan \u00b7 existing session", "kind": "terminal", "next": "m13", "action": "Write an instruction", "narration": "The terminal remains the actual way to work with the agent. Output, input and the execution target stay together. On the phone this is a focused screen. Back takes you to the same task, while the session itself continues running."}, {"id": "m13", "platform": "mobile", "title": "Send with a clear target", "subtitle": "Review the instruction before sending", "kind": "compose", "next": "m14", "action": "Send to Rowan", "narration": "Before sending, the task and recipient remain visible. Here we ask Rowan to shorten the introduction in the reviewed brief. This reuses explicit communication with the existing agent. A new persistent feedback and iteration system is still separately scoped."}, {"id": "m14", "platform": "mobile", "title": "Activity is not acceptance", "subtitle": "Instruction delivered \u00b7 work continues", "kind": "progress", "next": "m19", "action": "Review the question", "narration": "The instruction is delivered to the current session, and activity changes without pretending the task is complete. Agent completion, product QA and your own acceptance remain separate. The board is not moved or cleared just because an agent returns a successful result."}, {"id": "m15", "platform": "mobile", "title": "Start only when you choose", "subtitle": "An accepted task, ready for work", "kind": "launch", "next": "m16", "action": "Inspect the task menu", "narration": "For an unstarted task, the existing launch sheet makes recipient, folder and execution target explicit. In Thy Quill, the configured start rules still apply. Simply choosing a filter, opening a material or viewing this sheet starts nothing."}, {"id": "m16", "platform": "mobile", "title": "Edit without losing your place", "subtitle": "Task menu \u00b7 deliberate actions", "kind": "edit", "next": "m17", "action": "Add a material", "narration": "Editing stays deliberate. The task menu offers Edit, and the editor has clear Save and Cancel actions. Tapping elsewhere does not silently discard a draft. Materials stay attached to the same identity while the title changes."}, {"id": "m17", "platform": "mobile", "title": "Add the right kind of resource", "subtitle": "Three different resource meanings", "kind": "add", "next": "m18", "action": "Inspect a public link", "narration": "Choose whether to attach a copied file, bind a live workspace document or add a labelled web destination. These are different operations. The interface must not quietly turn a live document into a copy, or download a public link as though it were an attachment."}, {"id": "m18", "platform": "mobile", "title": "Open links deliberately", "subtitle": "Public URL \u00b7 destination visible", "kind": "url", "next": "m19", "action": "Back to attention", "narration": "A public link shows its label and destination before the deliberate open action. It stays a link. This concept uses a harmless example address, and every task and file shown in these mock-ups is fictional."}, {"id": "m19", "platform": "mobile", "title": "Questions deserve a clear place", "subtitle": "Needs your attention", "kind": "attention", "next": "m20", "action": "Inspect a hidden selection", "narration": "Needs your attention brings real questions and approvals forward. A working lead does not hide a child waiting for you. The action takes you to the correct existing conversation, rather than a similarly named agent in another workspace."}, {"id": "m20", "platform": "mobile", "title": "A filter cannot steal your task", "subtitle": "Selected task outside current filter", "kind": "outside", "next": "m21", "action": "See an empty result", "narration": "Suppose the agent stops running while you are reading its brief. The task may leave the running filter, but your open work stays put. A notice explains that it is outside the current filter, and Reveal takes you back without switching to a neighbour."}, {"id": "m21", "platform": "mobile", "title": "Make empty results recoverable", "subtitle": "No matching tasks", "kind": "empty", "next": "m22", "action": "See an offline state", "narration": "An empty result tells you which filters are active and offers one clear way back to all tasks. It does not look like lost data. Search and material filters are private viewing preferences, and Back restores your prior list position."}, {"id": "m22", "platform": "mobile", "title": "Unknown is different from unstarted", "subtitle": "Offline \u00b7 last known information", "kind": "offline", "next": "m23", "action": "Inspect a material error", "narration": "When connectivity is unavailable, the app keeps known started history and labels current agent status as unavailable. An ended connection is not proof that work never began. Available local materials can still be read, while pending actions retain their honest state."}, {"id": "m23", "platform": "mobile", "title": "Failure states stay useful", "subtitle": "This material cannot play yet", "kind": "error", "next": "m24", "action": "Switch to Rituals", "narration": "A damaged download, denied access or unsupported codec explains what failed and what you can do next. Retry and external opening are explicit fallbacks. They do not count as successful in-app playback for the supported formats in the Stage One requirement."}, {"id": "m24", "platform": "mobile", "title": "The same pattern for Rituals", "subtitle": "Command \u00b7 Rituals", "kind": "rituals", "next": "m25", "action": "Open the definition", "narration": "Switching from Notepad to Rituals changes the whole Command context. The list, selected definition, occurrence, materials and associated agents agree. It reuses the existing scheduler rather than creating a second system with a different idea of what is running."}, {"id": "m25", "platform": "mobile", "title": "Keep instructions and timing clear", "subtitle": "Daily summary \u00b7 definition", "kind": "schedule", "next": "m26", "action": "Review the latest occurrence", "narration": "The definition shows the existing instructions, schedule and target. Editing the schedule is a deliberate save, separate from commenting on a report. Reviewing an output does not silently change tomorrow\u2019s timing or launch another occurrence."}, {"id": "m26", "platform": "mobile", "title": "Review one particular occurrence", "subtitle": "Today \u00b7 09:00 occurrence", "kind": "occurrence", "next": "m27", "action": "Inspect retained output", "narration": "An occurrence keeps its own output and associated run. Open its report using the same material experience. A successful scheduler result is different from a useful report; the screen makes space for your review rather than treating green execution as approval."}, {"id": "m27", "platform": "mobile", "title": "Do not invent a live session", "subtitle": "Finished occurrence \u00b7 retained summary", "kind": "retained", "next": "m28", "action": "Open Control", "narration": "For an older occurrence, retained output remains readable even when the live terminal has ended. The app says what is available. It never reconnects you to a different session or pretends a missing transcript is a complete history."}, {"id": "m28", "platform": "mobile", "title": "Keep code review within reach", "subtitle": "Control \u00b7 changed files", "kind": "control", "next": "m29", "action": "Open Chronicle", "narration": "Control keeps its own code-review purpose. Selecting a task does not hide unrelated repository changes. On mobile, a file list drills into a focused diff with explicit review actions. The detailed task experience should not crowd out the tools already available."}, {"id": "m29", "platform": "mobile", "title": "Read history without changing it", "subtitle": "Chronicle \u00b7 repository history", "kind": "chronicle", "next": "m30", "action": "Open Armoury", "narration": "Chronicle is the repository\u2019s history, not a new captured agent-conversation archive. Open a commit and inspect its changes read-only. The proposed phone layout uses the same drilldown-and-return pattern, so every mode feels familiar."}, {"id": "m30", "platform": "mobile", "title": "Preferences stay findable", "subtitle": "Armoury \u00b7 appearance preview", "kind": "settings", "next": "m31", "action": "Preview the light appearance", "narration": "Armoury keeps preferences accessible. This screen previews the eventual appearance controls and readable sizing. Stage One must already be usable; Stage Two completes visual consistency. Optional future history capture is not silently enabled by this redesign."}, {"id": "m31", "platform": "mobile", "title": "The same actions in light mode", "subtitle": "Porcelain appearance \u00b7 design preview", "kind": "light", "next": "m32", "action": "Review a notification", "narration": "The light appearance has the same task actions, filters and material distinctions. This is visual polish on the working experience, not a separate workflow. Contrast, text size, touch targets and keyboard behaviour need their own real product checks later."}, {"id": "m32", "platform": "mobile", "title": "A notification returns to the work", "subtitle": "Attention inbox", "kind": "notifications", "next": "m33", "action": "Review before completion", "narration": "A notification names the task and the agent that needs you. Following it restores the right workspace and task, even if an old filter would hide it. It should never throw your reply into whichever terminal happened to be selected previously."}, {"id": "m33", "platform": "mobile", "title": "You decide when it is done", "subtitle": "Agent finished \u00b7 your review remains", "kind": "review", "next": "m02", "action": "Return to the board", "narration": "Finally, review the changed material and the evidence relevant to the task. An agent finishing does not complete the board item. You decide when to accept or clear it. These flows are a proposal for your review, and the product implementation and QA remain open."}, {"id": "d01", "platform": "desktop", "title": "The whole workspace together", "subtitle": "Task \u00b7 material \u00b7 agents \u00b7 terminal", "kind": "overview", "focus": "left", "next": "d02", "action": "Next view", "narration": "Desktop begins with the whole task context visible: Thy Quill on the left, the selected material in the centre, associated agents above the real terminal on the right. This is an HTML concept walkthrough. The aim is to rearrange what exists and fill a few specific gaps."}, {"id": "d02", "platform": "desktop", "title": "Find the work that matters", "subtitle": "Search and status above the task list", "kind": "filters", "focus": "left", "next": "d03", "action": "Next view", "narration": "Filters sit above the task list. Choose one status, then combine it with text search and Has materials. Started and currently running are different. Unknown status is visible. The seven board sections, stored order and row identities remain unchanged."}, {"id": "d03", "platform": "desktop", "title": "A brief beside a working agent", "subtitle": "Independent material and terminal selection", "kind": "pdf", "focus": "centre", "next": "d04", "action": "Next view", "narration": "Read the PDF while the same agent continues working alongside it. This needs independent material and terminal selection, because the current shared area chooses between them. The new viewer host reuses existing Markdown and image viewers and adds the missing ordinary PDF reader."}, {"id": "d04", "platform": "desktop", "title": "A clear material shelf", "subtitle": "Snapshot \u00b7 live document \u00b7 public URL", "kind": "materials", "focus": "centre", "next": "d05", "action": "Next view", "narration": "The shelf shows what is already attached or bound to the task. A copied PDF remains a snapshot, a workspace document is live, and a web destination remains a public link. Names, freshness and availability help you choose the right thing before giving feedback."}, {"id": "d05", "platform": "desktop", "title": "Watch the proposed experience", "subtitle": "MP4 playback in the centre", "kind": "video", "focus": "centre", "next": "d06", "action": "Next view", "narration": "MP4 video plays inside the centre material area. Play, pause, seek, volume and expansion are ordinary first-stage controls. The agent terminal stays alive. A public URL is not automatically fetched, and a failed decoder does not masquerade as a working player."}, {"id": "d06", "platform": "desktop", "title": "Listen and keep your context", "subtitle": "Audio playback without a new library", "kind": "audio", "focus": "centre", "next": "d07", "action": "Next view", "narration": "An attached audio file uses the same shelf and a compact player. Playback begins deliberately, and switching material stops the previous player. A filter change alone keeps your selected task and media intact. Generation, editing and transcoding remain separate proposals."}, {"id": "d07", "platform": "desktop", "title": "Choose the exact associated agent", "subtitle": "Working parent \u00b7 child needs attention", "kind": "agents", "focus": "right", "next": "d08", "action": "Next view", "narration": "The right-hand inspector shows existing task associations and actual ancestry. Here a lead is working while a child needs your answer. Selecting either one focuses its exact session. Unknown or ended links stay honest; the view does not invent a replacement agent."}, {"id": "d08", "platform": "desktop", "title": "Give the terminal room", "subtitle": "Expand, then return to the same task", "kind": "terminal", "focus": "right", "next": "d09", "action": "Next view", "narration": "Expand the terminal when you need more room, then return to the reading layout. The session, input, scrollback and execution target remain the same. Keyboard focus belongs to one control at a time, so typing into search or the viewer never sends accidental terminal input."}, {"id": "d09", "platform": "desktop", "title": "Rituals share the composition", "subtitle": "One source change, one coherent context", "kind": "rituals", "focus": "centre", "next": "d10", "action": "Next view", "narration": "The Notepad and Rituals selector changes every Command region together. Open a particular occurrence to review its output and associated run. Existing scheduler controls keep their authority. Looking at a report never changes its schedule or triggers another delivery."}, {"id": "d10", "platform": "desktop", "title": "Control and Chronicle keep their jobs", "subtitle": "Code review and repository history", "kind": "control", "focus": "centre", "next": "d11", "action": "Next view", "narration": "Control remains code review, and Chronicle remains repository history. Their scope does not shrink to the selected task. This preserves existing workflows while making task work more coherent, rather than replacing the whole application with a single new screen."}, {"id": "d11", "platform": "desktop", "title": "State changes without losing your place", "subtitle": "Outside-filter, unavailable and empty states", "kind": "outside", "focus": "left", "next": "d12", "action": "Next view", "narration": "When live status changes, counts and list membership can update without stealing selection. An open task outside the current filter stays visible with a Reveal action. Offline and unknown states are explicit, and clearing an empty filter restores the list without changing stored data."}, {"id": "d12", "platform": "desktop", "title": "Function first, visual polish second", "subtitle": "Two stages, one reviewable plan", "kind": "light", "focus": "centre", "next": "d01", "action": "Next view", "narration": "Stage One delivers the task workbench, materials, ordinary readers and players, useful filters and existing-agent continuity. Stage Two completes the visual polish shown here. The PDF contains the full proposed mobile order and desktop views, ready for your review on your phone."}]};</script><script>/* Fictional, offline design proposal. No product APIs or real task mutations. */
let scenes=[], current; const app=document.querySelector('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const target=id=>current?.platform==='desktop'?({'m02':'d01','m03':'d02','m04':'d02','m05':'d01','m06':'d04','m07':'d03','m08':'d03','m09':'d05','m10':'d06','m11':'d07','m12':'d08','m19':'d07','m20':'d11','m24':'d09','m28':'d10','m31':'d12'}[id]||id):id;
const link=(id,label,cls='button')=>`<a class="${cls}" href="#${target(id)}">${label}</a>`;
const btn=(label,note,cls='')=>`<button class="${cls}" data-note="${esc(note||'Concept only — this action would use the existing product control.')}">${label}</button>`;
const title=(s)=>`<div class="title"><div class="caps">${esc(s.subtitle)}</div><h1>${esc(s.title)}</h1><p>Stage 1 experience · proposed composition</p></div>`;
const tabs=active=>`<div class="tabs">${['Overview','Materials','Agents'].map((x,i)=>link(['m05','m06','m11'][i],x,x===active?'active':'')).join('')}</div>`;
const chips=()=>`<div class="chips">${link('m02','All','button chip '+(current.kind==='board'?'active':''))}${link('m04','Running','button chip '+(current.kind==='running'?'active':''))}${link('m19','Needs you','button chip')}${link('m03','Filters','button chip')}</div>`;
const groups=[['🔮 Future',[]],['🟠 Backlog',[['A calmer first minute','Not started · 2 materials','m15']]],['🟣 Pending coding',[['Welcome screen feels clear','2 agents · 5 materials','m05'],['The export has a home','Working · 1 material','m05']]],['🧪 New commits to QA',[['A smoother sign-in','Ready for your review','m33']]],['🎬 QA’d items',[['Readable at a glance','Evidence attached','m33']]],['🧩 Implicitly QA’d',[]],['📣 Unfiltered feedback',[['Make room for the notes','Your inbox','m16']]]];
function board(filtered=false){return `<div class="board">${groups.map(([h,items])=>`<div class="bucket">${h}</div>${items.filter((v,i)=>!filtered||h.includes('Pending')).map(([n,t,id])=>`<a class="task-row ${n.startsWith('Welcome')?'chosen':''}" href="#${id}"><span class="dot ${t.includes('Not')?'grey':''}"></span><span class="label">${n}<span class="sub">${t}</span></span><span>›</span></a>`).join('')}`).join('')}</div>`}
const materialRows=()=>[['PDF','Welcome brief.pdf','Attachment · copied 4 Oct · 4 pages','m07'],['MD','Welcome brief.md','Workspace document · live source','m08'],['MP4','Experience walkthrough','Attachment · video · 02:14','m09'],['MP3','A narrated brief','Attachment · audio · 01:32','m10'],['↗','Reference gallery','Public URL · example.com','m18']].map(([icon,n,t,id])=>`<a class="material" href="#${id}"><span class="fileicon">${icon}</span><div><span class="name">${n}</span><small>${t}</small></div><span class="arrow">›</span></a>`).join('');
const agents=()=>`<a href="#m12" class="agent"><span class="avatar">R</span><div><b>Rowan</b><small>Lead · <span class="live">working</span></small></div><span class="tag" style="margin-left:auto">Local</span></a><a href="#m19" class="agent"><span class="avatar">M</span><div><b>Mira</b><small>Child of Rowan · <span class="warn">needs you</span></small></div><span style="margin-left:auto">›</span></a>`;
const terminal=()=>`<div class="terminal"><div class="grey">Northstar / welcome-screen<br>Rowan · existing local session</div><p><span class="green">›</span> Shorten the introduction in the brief.</p><p>I’ll keep the first action clear and move the detail below it.</p><p class="green">Updated welcome-brief.md</p><p class="grey">Checking the revised copy…</p><div class="prompt"><span class="green">❯</span> <span class="grey">Continue with Rowan</span><br>${link('m13','Write an instruction','button small')}</div></div>`;
const paper=()=>`<div class="paper"><div class="caps" style="color:#54736b">Northstar / design brief</div><div class="rule"></div><h2>A good beginning<br>feels effortless.</h2><p>Let people take one clear next step. Keep the explanation nearby, without making it the first thing they must read.</p><div class="sample-art"><b>Welcome to Northstar</b><p>Your workspace is ready.</p><span>Open your first task →</span></div><p><b>What we will review</b><br>A clear first action, readable material previews, and a reliable route back to the work.</p><small style="color:#64766d">Fictional sample · design concept</small></div>`;
const filters=()=>`<div class="stack"><label class="search">⌕ <input aria-label="Search task titles" placeholder="Search task titles" style="border:0;padding:0;background:transparent"></label><div class="caps">Task status · choose one</div><div>${['All','Not started','Started','Agents running','Needs attention','Failed or blocked','Unknown'].map((n,i)=>`<label class="filter-option"><input type="radio" name="status" ${i===3?'checked':''}>${n}</label>`).join('')}</div><label class="filter-option"><input type="checkbox">Has materials</label><p class="muted" style="font-size:12px">Search AND status AND materials. Viewing preferences never move tasks.</p>${link('m04','Apply filters','button primary')}</div>`;
function content(kind){switch(kind){
case 'workspace':return `<div class="stack"><p class="muted">Your work stays in its workspace.</p><a class="card selected" href="#m02"><div class="row between"><h2>Northstar</h2><span>→</span></div><p>Design and build a thoughtful first run.</p><div class="row" style="margin-top:16px"><span class="tag live">2 agents working</span><span class="tag">1 question</span></div></a><div class="card"><h3>Field notes</h3><p>Personal ideas and experiments</p></div><p class="hero-note">All workspaces, tasks and people in this concept are fictional.</p></div>`;
case 'board':case 'light':return `<div class="row between" style="margin-bottom:14px"><div class="mode-switch">${link('m02','Notepad')}${link('m24','Rituals')}</div>${link('m16','+','button small')}</div>${chips()}${board()}`;
case 'filters':return filters();
case 'running':return `${chips()}<div class="notice" style="margin-top:15px">2 matching tasks · 1 associated question</div>${board(true)}<a class="card" href="#m19" style="display:block;margin-top:15px"><div class="caps warn">Needs your attention</div><h3 style="margin-top:7px">Mira has a question</h3><p>Welcome screen feels clear →</p></a>`;
case 'task':case 'overview':return `${tabs('Overview')}<div class="card"><div class="row between"><span class="tag">Pending coding</span><span class="tag live">Working</span></div><h2 style="margin:14px 0">Welcome screen feels clear</h2><p>One clear first action. Keep the explanation close, and make the task materials easy to review.</p></div><div class="row" style="margin:15px 0">${link('m06','5 materials','button')}${link('m11','2 agents','button')}</div><div class="caps">Associated agents</div>${agents()}<p class="hero-note">Reading a task does not start, move or complete it.</p>`;
case 'materials':return `${tabs('Materials')}<div class="row between"><div class="caps">Welcome screen · 5 materials</div>${link('m17','+ Add','button small')}</div>${materialRows()}<p class="hero-note">A copied file, a live document and a URL keep their distinct meanings.</p>`;
case 'pdf':return `<div class="row between"><span class="tag">Attachment · copied 4 Oct</span>${link('m06','Materials','button small')}</div><div class="viewer-tools">${btn('‹','Previous PDF page')}<span>Page 2 / 4</span>${btn('›','Next PDF page')}${btn('100%','PDF zoom controls')}${btn('↗','Expand the reader')}</div>${paper()}`;
case 'document':return `<div class="stack"><div class="notice">Live workspace document<br><b>welcome-brief.md</b> · current source</div><div class="card"><div class="caps">Last edited just now · Rowan</div><h2 style="margin:17px 0">A clear first step</h2><p>The welcome screen offers one main action: open your first task.</p><h3 style="margin-top:20px">Acceptance notes</h3><p>• The next action is easy to find.<br>• Materials open in context.<br>• Returning restores the task.</p><p class="muted">This live revision can be newer than the copied PDF.</p></div>${link('m13','Discuss this revision','button')}</div>`;
case 'video':return `<div class="stack"><span class="tag">Attachment · MP4 · fictional player state</span><div class="player-stage"><div class="caps">Northstar / experience preview</div><h2>A calmer first minute.</h2>${btn('▶','Concept player. The narrated review videos are available from the review page.','play')}<small>Paused · press play deliberately</small></div><div><div class="progressline"></div><div class="row between"><small>00:34</small><small>02:14</small></div></div><div class="row between">${btn('▶ Play','Play the selected attached MP4')}${btn('Volume','Player volume')}${btn('Expand','Expand playback')}</div><div class="notice">In-app playback is Stage 1.<br>No autoplay when you enter or return.</div></div>`;
case 'audio':return `<div class="stack"><span class="tag">Attachment · MP3</span><div class="card" style="padding:26px 20px"><div class="caps">A narrated brief</div><h2 style="margin-top:12px">Listen to the proposal</h2><div class="wave">${Array.from({length:31},(_,i)=>`<i style="height:${18+Math.round(63*Math.abs(Math.sin(i*.84)))}px"></i>`).join('')}</div><div class="progressline"></div><div class="row between"><small>00:24</small><small>01:32</small></div><div class="row" style="justify-content:center;margin-top:22px">${btn('−10s','Seek back ten seconds')}${btn('▶ Play','Play the selected attached audio file','primary')}${btn('+10s','Seek forward ten seconds')}</div></div><div class="notice">Leaving this viewer stops playback. Return, then press Play to resume.</div><p class="hero-note">MP3, M4A/AAC and WAV PCM in Stage 1. Media creation stays separate.</p></div>`;
case 'agents':return `${tabs('Agents')}<div class="caps">Real task associations</div>${agents()}<div class="notice" style="margin-top:22px">Selecting an agent opens that exact session. Ended or unknown links are shown honestly.</div>${link('m12','Continue with Rowan','button primary')}<p class="hero-note">The child relationship shown here is a fictional example of proven ancestry.</p>`;
case 'terminal':return `${terminal()}<div class="row between" style="margin-top:16px"><span class="tag">Local · Northstar</span>${link('m05','Back to task','button small')}</div>`;
case 'compose':return `<div class="stack"><div class="notice">To Rowan · existing local session<br>Task: Welcome screen feels clear</div><label><div class="caps" style="margin-bottom:9px">Your instruction</div><textarea rows="6">Please shorten the introduction in welcome-brief.md. Keep the first action clear and move the detail below it.</textarea></label><div class="row">${link('m14','Send to Rowan','button primary')}${link('m12','Cancel','button')}</div><p class="hero-note">This reuses the existing agent conversation. It does not create a new feedback database.</p></div>`;
case 'progress':return `<div class="stack"><div class="notice">✓ Instruction delivered to Rowan</div><div class="card"><div class="row"><span class="dot"></span><h3>Rowan is working</h3></div><p>Revising welcome-brief.md</p><div class="progressline"></div><small>Activity is live; acceptance remains yours.</small></div>${agents()}${link('m08','Review the live document','button primary')}<p class="hero-note">No automatic board move or completion.</p></div>`;
case 'launch':return `<div class="stack"><div class="notice amber">Not started · opening this sheet starts nothing</div><div class="card stack"><h2>A calmer first minute</h2><label>Agent<select><option>Existing configured agent</option></select></label><label>Workspace<input value="Northstar" readonly></label><label>Target<select><option>Local workspace</option><option>Configured remote workspace</option></select></label>${btn('Use existing start action','In the real product, configured board rules and the explicit launch action decide when work starts.','primary')}</div><p class="hero-note">For Thy Quill, moving to Pending coding is the configured work signal.</p></div>`;
case 'edit':return `<div class="stack"><div class="row">${link('m05','Task details','button')}${link('m17','Add resource','button')}</div><label>Task label<textarea rows="3">Welcome screen feels clear</textarea></label><label>Section<select><option>Pending coding</option><option>Backlog</option></select></label><div class="row">${link('m05','Save','button primary')}${link('m05','Cancel','button')}</div><div class="notice">Draft changes are deliberate. The task identity and its resources stay together.</div></div>`;
case 'add':return `<div class="stack">${[['Attachment','Copy a file snapshot to this task.','m06'],['Workspace document','Bind a live file in this workspace.','m08'],['Public URL','Name an HTTP or HTTPS destination.','m18']].map(([h,p,id])=>`<a class="card" href="#${id}"><h2>${h} <span style="float:right">›</span></h2><p>${p}</p></a>`).join('')}<p class="hero-note">Choose the meaning first. Resource kinds are never silently converted.</p></div>`;
case 'url':return `<div class="stack"><span class="tag">Public URL</span><div class="card"><h2>Reference gallery</h2><p>https://example.com</p><p class="muted">This destination opens only when you choose.</p></div><a class="button primary" href="https://example.com" target="_blank" rel="noopener noreferrer">Open destination ↗</a>${link('m06','Back to materials','button')}<p class="hero-note">No automatic download or conversion into an attachment.</p></div>`;
case 'attention':return `<div class="stack"><div class="notice amber">Mira needs your answer<br>Child of Rowan · Welcome screen feels clear</div><div class="card"><h2>Which wording should I use?</h2><p>“Open your first task” is clearer, but “Get started” is shorter.</p><p>Would you like the clearer version?</p></div>${link('m13','Reply to the exact session','button primary')}${link('m05','Open task context','button')}<div class="row"><span class="dot"></span><small>Rowan continues working</small></div></div>`;
case 'outside':return `<div class="stack"><div class="notice amber">This task is outside “Agents running”. Your open material stays here.</div><div class="row">${link('m02','Reveal task','button primary')}${link('m02','Clear filter','button')}</div><div class="card"><div class="caps">Still selected</div><h2 style="margin-top:12px">Welcome screen feels clear</h2><p>Rowan finished. Your brief remains open.</p></div>${paper()}</div>`;
case 'empty':return `<div class="stack">${chips()}<div class="search">⌕ onboarding · Has materials</div><div class="empty"><div class="big">⌕</div><h2>No matching tasks</h2><p class="hero-note">Your tasks are still here. Try a different status or clear the search.</p>${link('m02','Clear filters','button primary')}</div></div>`;
case 'offline':return `<div class="stack"><div class="notice amber">Offline · agent status unavailable</div><div class="card"><h2>Welcome screen feels clear</h2><p><span class="tag">Started before</span> <span class="tag warn">Live status unknown</span></p><p>Last known task context is available. No new delivery is claimed.</p></div>${link('m07','Read an available local copy','button')}${btn('Check connection','The real app would refresh its existing connectivity state.')}<p class="hero-note">Unknown is not “Not started”.</p></div>`;
case 'error':return `<div class="stack"><span class="tag">Attachment · preview.mov</span><div class="empty card"><div class="big warn">!</div><h2>This format cannot play here</h2><p class="hero-note">This sample uses an unsupported codec. No playback has started.</p>${btn('Open externally','Deliberate fallback to an available external application.','primary')}</div>${link('m06','Choose another material','button')}<div class="notice">A download failure would offer Retry. An external fallback does not prove supported in-app playback.</div></div>`;
case 'rituals':return `<div class="mode-switch">${link('m02','Notepad')}${link('m24','Rituals')}</div><div class="card selected" style="margin-top:18px"><div class="row between"><h2>Daily summary</h2><span class="tag live">Enabled</span></div><p>Every weekday · 09:00</p><p>Latest occurrence: completed execution</p>${link('m25','Open definition →','button small')}</div><div class="card"><h3>Weekly review</h3><p>Friday · 16:00</p></div><div class="notice" style="margin-top:20px">Definition, occurrence, materials and agents switch together.</div>`;
case 'schedule':return `<div class="stack"><div class="card"><div class="caps">Existing scheduler definition</div><h2 style="margin-top:12px">Daily summary</h2><p>Summarise the previous day’s task activity and highlight open questions.</p></div><div class="card"><h3>Weekdays · 09:00</h3><p>Europe/London · Northstar</p>${btn('Edit schedule','Uses the existing explicit scheduler edit and save.','small')}</div>${link('m26','Today’s occurrence →','button primary')}<p class="hero-note">Reading a report changes neither the schedule nor the next delivery.</p></div>`;
case 'occurrence':return `<div class="stack"><span class="tag live">Execution completed · 09:02</span><div class="card"><h2>Today’s summary</h2><p>2 tasks progressed. 1 question remains.</p><p>Your review determines whether the report is useful.</p>${link('m08','Read the report','button')}</div><div class="card"><h3>Associated run</h3><p>Rowan · ended after delivery</p>${link('m27','View retained summary','button small')}</div></div>`;
case 'retained':return `<div class="stack"><div class="notice">Live session ended. Retained output is available.</div><div class="card"><h2>Daily summary delivered</h2><p>09:00 — occurrence started<br>09:02 — report saved<br>09:02 — execution ended</p></div>${link('m08','Read the retained report','button primary')}<p class="hero-note">A missing full transcript is not presented as a complete conversation archive.</p></div>`;
case 'control':return `<div class="stack"><div class="row between"><span class="tag">Repository · all changes</span><span class="tag">2 files</span></div><div class="card"><h3>welcome-brief.md</h3><p>3 additions · 2 removals</p></div><div class="diff"><span class="muted">@@ Welcome message @@</span><br><span class="remove">− Get started with all the tools.</span><span class="add">+ Open your first task.</span><br> Keep the details close.</div><div class="row">${btn('Review changes','Uses existing repository review controls.','primary')}${link('m29','History','button')}</div><p class="hero-note">Repository scope remains independent of the selected task.</p></div>`;
case 'chronicle':return `<div class="stack"><div class="tag">Repository history · read only</div><div class="timeline">${[['Today, 10:42','Clarify the welcome message'],['Today, 09:18','Keep materials in task context'],['Yesterday, 16:30','Improve the first-run layout']].map(([t,n])=>`<div><small>${t}</small><h3>${n}</h3><p class="hero-note">Fictional revision · inspect changes</p>${link('m28','View diff','button small')}</div>`).join('')}</div><p class="hero-note">Chronicle is repository history, not captured agent conversation history.</p></div>`;
case 'settings':return `<div class="stack"><div class="caps">Appearance · Stage 2 preview</div><div class="row">${link('m02','Slate','button')}${link('m31','Porcelain','button primary')}</div><div class="card"><h3>Readable sizing</h3><p>Comfortable text and reachable controls.</p>${btn('Standard ▾','Preview of appearance controls; exact product settings remain scoped.','small')}</div><div class="card"><h3>Agents and integrations</h3><p>Existing Armoury configuration stays in one place.</p></div><div class="notice">Visual polish follows the working Stage 1 experience.</div></div>`;
case 'notifications':return `<div class="stack"><a class="card selected" href="#m19"><div class="caps warn">Needs your answer · just now</div><h2 style="margin-top:13px">Mira has a question</h2><p>Welcome screen feels clear · Northstar</p><p>Open the exact task and session →</p></a><div class="card"><div class="caps">Ready to review</div><h3 style="margin-top:12px">A smoother sign-in</h3><p>Evidence is available. Your acceptance is pending.</p></div><p class="hero-note">A destination outside the active filter is revealed without switching to another task.</p></div>`;
case 'review':return `<div class="stack"><div class="notice">Agent finished. Your review remains.</div><div class="card"><h2>Welcome screen feels clear</h2><p>Review the latest brief, changed code and the evidence relevant to this task.</p><div class="row" style="margin-top:15px">${link('m08','Read material','button small')}${link('m28','Review diff','button small')}</div></div><div class="card"><h3>You decide when it is done</h3><p>The actual product would use your deliberate completion or clearing action.</p></div><p class="hero-note">These HTML concepts are not product QA. Implementation and real acceptance remain open.</p></div>`;
default:throw new Error('Unknown view '+kind);}}
function mobile(s){return `<div class="phone"><div class="statusbar"><span>9:41</span><span>▮▮▮  ◉  ▰</span></div><header class="appbar"><div class="row">${link(s.id==='m01'?'m02':'m02','‹','quiet')}<span class="logo">⌂</span><b>Northstar</b></div><span class="concept">HTML CONCEPT</span></header><section class="content">${title(s)}${content(s.kind)}</section><div class="tourbar"><button class="small" data-chapters>☷</button><span class="counter">${s.id.slice(1)} / 33</span>${link(s.next,s.action+' →','button primary')}</div><nav class="bottom-nav" aria-label="Application modes">${[['m02','⌘','Command'],['m28','◇','Control'],['m29','◷','Chronicle'],['m30','⚙','Armoury']].map(([id,icon,n])=>`<a href="#${id}" class="${(s.kind==='control'?n==='Control':s.kind==='chronicle'?n==='Chronicle':s.kind==='settings'?n==='Armoury':n==='Command')?'active':''}"><span>${icon}</span>${n}</a>`).join('')}</nav></div>`}
function desktop(s){let centre=['overview','filters','agents','terminal','light'].includes(s.kind)?'pdf':s.kind; return `<div class="desk ${s.kind==='terminal'?'expanded-terminal':''}"><header class="desk-head"><span class="logo">⌂</span><b>Northstar</b><nav>${[['d01','Command'],['d10','Control'],['m29','Chronicle'],['m30','Armoury']].map(([id,n])=>link(id,n,n==='Command'?'active':'')).join('')}</nav><span class="concept">HTML CONCEPT · S157</span><span class="avatar">D</span></header><div class="desk-body"><aside class="desk-left"><div class="row between"><h2>Thy Quill</h2><span class="tag">Northstar</span></div><div class="mode-switch" style="margin:17px 0">${link('d01','Notepad')}${link('d09','Rituals')}</div><div class="search">⌕ Search tasks</div><div class="chips" style="margin-top:10px">${link('d02',s.kind==='outside'?'Running':'All tasks ▾','button chip active')}${link('d04','Has materials','button chip')}</div>${s.kind==='filters'?`<div class="card" style="margin-top:10px">${['All','Not started','Started','Agents running','Needs attention','Failed or blocked','Unknown'].map(n=>`<div style="padding:6px;font-size:12px">${n}</div>`).join('')}</div>`:s.kind==='rituals'?content('rituals'):board()}${s.kind==='outside'?'<div class="notice amber">Selected task is outside this filter.<br><a href="#d01"><u>Reveal task</u></a></div>':''}</aside><section class="desk-centre">${title(s)}<div class="tabs">${link('d03','Brief','active')}${link('d04','Materials')}${link('d05','Video')}${link('d06','Audio')}</div>${content(centre)}</section><aside class="desk-right"><div class="inspector"><div class="row between"><h3>Task agents</h3><span class="tag">2 associated</span></div>${agents()}<small style="display:block;margin-top:15px">Welcome screen feels clear · exact sessions</small></div><div class="terminal-pane"><div class="row between"><h3>Rowan’s terminal</h3>${link('d08','Expand','button small')}</div>${terminal()}</div></aside></div><footer class="desk-footer"><span>Design proposal · rearrange + fill gaps first · visual polish second</span><div class="row"><span>${s.id.slice(1)} / 12</span><button class="small" data-chapters>Chapters</button>${link(s.next,'Next view →','button small primary')}</div></footer></div>`}
function render(){let id=location.hash.slice(1)||'m01';current=scenes.find(s=>s.id===id)||scenes[0];document.body.classList.toggle('light',current.kind==='light');app.innerHTML=current.platform==='mobile'?mobile(current):desktop(current);if(current.platform==='desktop')app.querySelectorAll('a[href^="#"]').forEach(a=>a.hash=target(a.hash.slice(1)));document.title=current.title+' — Silver Citadel concept';document.querySelector('#chapters').hidden=true;document.querySelector('.content')?.scrollTo(0,0);window.scrollTo(0,0);app.dataset.scene=current.id;}
function chapters(){const p=document.querySelector('#chapters');p.innerHTML=`<div class="row between"><div><div class="caps">Design review · 4 October 2026</div><h2>Every proposed journey</h2></div><button data-close>Close</button></div><p class="hero-note">Navigate freely. These are fictional HTML concepts; no action changes a real task.</p>${['mobile','desktop'].map(platform=>`<h2>${platform==='mobile'?'Mobile · 33 screens':'Desktop · 12 views'}</h2><div class="chapter-grid">${scenes.filter(s=>s.platform===platform).map(s=>`<a href="#${s.id}">${s.id.toUpperCase()} · ${esc(s.title)}</a>`).join('')}</div>`).join('')}`;p.hidden=false;}
document.addEventListener('click',e=>{let el=e.target.closest('[data-chapters],[data-close],[data-note]');if(!el)return;if(el.hasAttribute('data-chapters'))chapters();else if(el.hasAttribute('data-close'))document.querySelector('#chapters').hidden=true;else{document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=el.dataset.note;document.body.append(t);setTimeout(()=>t.remove(),4200)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#chapters').hidden=true});
window.addEventListener('hashchange',render);
(async()=>{scenes=window.S157_SCENES?.scenes||(await(await fetch('scenes.json')).json()).scenes;render();window.S157_READY=true})().catch(e=>{app.textContent='Unable to load concept scenes: '+e.message});
</script></body></html>
